            "Scratches around the lever suggest more than one attempt. It worked eventually.",
            "A second, smaller lever nearby looks like a backup — untouched, still in its safety position.",
            "Frost has built up along the seal, old and undisturbed until now.",
            "A warning label, half peeled away, once read something about pressure differentials. The rest is illegible."
          ]}},
        bridge:{ name:'Dark Bridge', color:'var(--rose)',
          desc:"Consoles long dead, one still faintly warm to the touch. The logs, if they exist, aren't giving anything up easily.",
          ambient:"Bas found the security station first. Didn't say much, just kept looking around.",
          scene:`<rect width="320" height="160" fill="#0a0708"/>
            <rect x="40" y="90" width="240" height="30" rx="4" fill="var(--rose)" opacity="0.15"/>
            <rect x="60" y="60" width="50" height="25" fill="var(--rose)" opacity="0.2"/>
            <rect x="230" y="60" width="50" height="25" fill="var(--rose)" opacity="0.2"/>`,
          item:{ name:'A Frozen Console Readout', lines:[
            "The last logged command, half-executed and never completed. Impossible to tell what it was trying to do.",
            "Oskar thinks the power failure was gradual, not sudden. Whoever was aboard had time to prepare.",
            "A secondary display, dark until now, flickers weakly to life when touched. Briefly, then nothing.",
            "The seat in front of the console is angled oddly, like someone left in the middle of turning around.",
            "A single indicator light, unrelated to the main systems, blinks steadily. Nobody's sure what it's for."
          ]}},
        quarters:{ name:'Empty Quarters', color:'var(--rose)',
          desc:"Personal effects left behind, neatly enough that this wasn't an emergency evacuation. More like packing light.",
          ambient:"A child's drawing is still taped to one wall. Whoever lived here meant to come back for it.",
          scene:`<rect width="320" height="160" fill="#0a0708"/>
            <rect x="40" y="90" width="90" height="35" rx="6" fill="var(--rose)" opacity="0.15"/>
            <rect x="180" y="40" width="40" height="30" fill="var(--rose)" opacity="0.12"/>`,
          item:{ name:'A Half-Packed Storage Case', lines:[
            "Clothes, a few tools, nothing sentimental. The important things were taken. This was left on purpose.",
            "There's room in the case for more. They ran out of time, not options.",
            "A folded piece of fabric sits on top, deliberately placed rather than left behind by accident.",
            "The case's latch is broken, an old repair job, patched with something not original to the ship.",
            "Underneath the case, a single loose photograph has slid partway under the bunk."
          ]}},
        cargo:{ name:'Sealed Cargo Hold', color:'var(--rose)',
          desc:"The one compartment still fully pressurized. Whatever's in here, someone wanted it protected.",
          ambient:"Dr. Amara wants to open this one carefully. Talia wants to open it immediately. They're negotiating.",
          scene:`<rect width="320" height="160" fill="#0a0708"/>
            <rect x="90" y="40" width="140" height="90" rx="6" fill="var(--rose)" opacity="0.2" stroke="var(--rose)" stroke-width="2"/>
            <circle cx="160" cy="85" r="8" fill="var(--gold)" opacity="0.6"/>`,
          item:{ name:'A Sealed Supply Crate', lines:[
            "Standard rations, medical supplies, nothing dramatic. Someone was provisioning for a long trip, not fleeing a disaster.",
            "A shipping label, faded but legible, lists a destination nobody on the crew recognizes. Worth looking into.",
            "The seal's intact, untouched, exactly as it would be if nobody ever came back for it.",
            "A second, smaller crate is tucked behind the first, deliberately hidden rather than simply stored.",
            "The shipping label lists a weight that doesn't quite match what's inside, according to Bas's scan."
          ]}}
      }
    },
    alienvessel:{
      name:'Aurin Wayfinder', tag:'First Contact', color:'var(--peri)',
      blurb:"A living ship, crewed by the Aurin — first real contact in this sector. Cautious optimism all around.",
      risk:'Low', time:'~10 min',
      locations:{
        interface:{ name:'Boarding Interface', color:'var(--peri)',
          desc:"The docking mechanism isn't mechanical at all — it's grown, flexible, almost breathing as it seals to the airlock.",
          ambient:"Wren has already filled six pages of notes and you haven't even boarded yet.",
          scene:`<rect width="320" height="160" fill="#0a0e16"/>
            <ellipse cx="160" cy="90" rx="100" ry="50" fill="var(--peri)" opacity="0.15"/>
            <path d="M100,90 Q160,60 220,90 Q160,120 100,90" fill="var(--peri)" opacity="0.25"/>`,
          item:{ name:'A Pulsing Threshold Membrane', lines:[
            "Warm, faintly luminous, opening and closing in a slow rhythm that might just be how the ship breathes.",
            "It reacted to the away team's approach before anyone touched it. Genuinely unsettling, genuinely fascinating.",
            "Touching it gently produces a faint ripple, like dropping a stone in still water.",
            "The rhythm slows noticeably when the away team stands still. Curious, or coincidence.",
            "Wren's convinced it's reacting to biometric signals. Nobody's arguing, exactly, just watching closely."
          ]}},
        commons:{ name:'Aurin Commons', color:'var(--peri)',
          desc:"A communal gathering space, walls curved and organic, several Aurin observing the visitors with open curiosity.",
          ambient:"Nobody's found a shared language yet, but somehow the tea got offered anyway.",
          scene:`<rect width="320" height="160" fill="#0a0e16"/>
            <ellipse cx="160" cy="100" rx="120" ry="45" fill="var(--peri)" opacity="0.12"/>
            <circle cx="110" cy="90" r="14" fill="var(--peri)" opacity="0.4"/>
            <circle cx="210" cy="95" r="14" fill="var(--peri)" opacity="0.4"/>`,
          item:{ name:'A Woven Offering Bowl', lines:[
            "Filled with something that smells vaguely like citrus. Rook accepted it graciously and has no idea what it is.",
            "The weave pattern in the bowl repeats in a way that might be decorative, or might be written language. Wren's on it.",
            "The weave shifts color slightly depending on the angle of the light. Deliberate, or simply how it's made.",
            "A second, smaller bowl nearby holds something that might be seeds, or might be currency.",
            "The material feels warm, almost alive, though Wren insists it's just thermally conductive."
          ]}},
        commanddeck:{ name:'Aurin Command Deck', color:'var(--peri)',
          desc:"Less a bridge than a circular chamber, the ship's equivalent of a captain positioned at its center, unmistakably in charge.",
          ambient:"The formalities took a while to sort out. Everyone seems relieved they're over.",
          scene:`<rect width="320" height="160" fill="#0a0e16"/>
            <circle cx="160" cy="90" r="55" fill="none" stroke="var(--peri)" stroke-width="2" opacity="0.4"/>
            <circle cx="160" cy="90" r="12" fill="var(--peri)" opacity="0.5"/>`,
          item:{ name:"The Ship-Mind's Focal Point", lines:[
            "A crystalline node at the chamber's center — possibly a console, possibly something closer to the ship's own thoughts.",
            "The Aurin captain gestured to it with obvious pride. Whatever it is, it matters to them a great deal.",
            "A soft hum radiates from the node, subtly different in pitch depending on who's standing closest.",
            "Yeth gestures toward it whenever the conversation turns serious. It seems to matter a great deal.",
            "The crystalline structure catches the light in patterns that don't quite repeat, like a held breath."
          ], flagLines:{ signalInvestigated:[
            "The pattern in the focal point's glow matches, almost exactly, the looping signal Wren traced from the Bridge. Coincidence seems unlikely.",
            "Yeth listens carefully when you mention the signal. She doesn't seem surprised. She doesn't explain, either.",
            "Wren compares her notes against the node's rhythm in real time. They line up. Neither of them says what that might mean, yet."
          ]}}},
        garden:{ name:'Living Garden', color:'var(--peri)',
          desc:"The ship doesn't have an engine room so much as a vast growing chamber — this vessel is farmed as much as flown.",
          ambient:"Fen would need to be physically restrained from moving in.",
          scene:`<rect width="320" height="160" fill="#0a0e16"/>
            <path d="M40,140 Q100,60 160,140 T280,140" fill="var(--sage)" opacity="0.25"/>
            <circle cx="160" cy="80" r="20" fill="var(--sage)" opacity="0.3"/>`,
          item:{ name:'A Cluster of Growth Pods', lines:[
            "Some kind of bio-material forming in real time — this might be how the Aurin build new sections of their ship.",
            "One pod is noticeably smaller than the rest, still forming. A ship that grows instead of gets built. Remarkable.",
            "One pod has visibly grown since the last visit, slow but unmistakable.",
            "The material inside pulses faintly, in rhythm with something elsewhere on the ship.",
            "Wren's taken careful notes without touching anything. A rare display of restraint."
          ]}}
      }
    },
    colony:{
      name:'Larkspur Colony', tag:'Colony', color:'var(--amber)',
      blurb:"A proper settlement — homes, a school, a market that's been open for generations. Busy in a way Thessaly never was.",
      risk:'Minimal', time:'~10 min',
      locations:{
        square:{ name:'Town Square', color:'var(--amber)',
          desc:"The heart of the colony, a fountain nobody remembers the origin of, kids weaving between market stalls.",
          ambient:"Someone recognizes the ship's registry and waves like an old friend. Small colony, big memory.",
          scene:`<rect width="320" height="160" fill="#140f0a"/>
            <circle cx="160" cy="90" r="25" fill="var(--peri)" opacity="0.2"/>
            <rect x="40" y="60" width="30" height="50" fill="var(--amber)" opacity="0.25"/>
            <rect x="250" y="60" width="30" height="50" fill="var(--amber)" opacity="0.25"/>`,
          item:{ name:'A Community Notice Board', lines:[
            "Lost pets, a harvest festival, someone selling a barely-used shuttle part. Ordinary colony business, all of it.",
            "A notice near the bottom asks if anyone's seen a 'large orange cat, answers to nothing.' {{PET}} has an alibi.",
            "A flyer for a lost cat has been up long enough that someone's added 'still missing, still loved' underneath.",
            "Half the postings are about the harvest festival. The other half are just neighbors trading favors.",
            "A child's drawing is pinned in the corner, clearly not meant for the board, kept up anyway."
          ]}},
        market:{ name:'Colony Market', color:'var(--amber)',
          desc:"Stalls that have clearly been in the same families for generations, everyone knowing everyone by name.",
          ambient:"Pip disappeared into the produce section twenty minutes ago. Not concerning. Expected, even.",
          scene:`<rect width="320" height="160" fill="#140f0a"/>
            <rect x="30" y="80" width="60" height="45" fill="var(--sage)" opacity="0.3"/>
            <rect x="130" y="75" width="60" height="50" fill="var(--rose)" opacity="0.3"/>
            <rect x="230" y="80" width="60" height="45" fill="var(--gold)" opacity="0.3"/>`,
          item:{ name:'A Basket of Local Produce', lines:[
            "Something like tomatoes, something distinctly not. The vendor insists both are essential to a proper stew.",
            "Pip's already negotiating a trade. This will end with a new recipe, guaranteed.",
            "Something resembling a pepper turns out to be startlingly sweet. Pip's taking careful notes.",
            "The vendor insists everything in the basket was picked that morning. The dew on it agrees.",
            "A small hand-written sign lists the farmer's name and, oddly, their favorite way to cook each item."
          ]}},
        schoolhouse:{ name:'The Schoolhouse', color:'var(--amber)',
          desc:"A single long building, windows open, a class clearly in the middle of something involving a lot of shouting and laughter.",
          ambient:"A teacher spots the away team and, without missing a beat, asks if anyone wants to talk about being in space.",
          scene:`<rect width="320" height="160" fill="#140f0a"/>
            <rect x="60" y="60" width="200" height="60" rx="4" fill="var(--amber)" opacity="0.2"/>
            <rect x="90" y="75" width="20" height="20" fill="var(--peri)" opacity="0.4"/>
            <rect x="150" y="75" width="20" height="20" fill="var(--peri)" opacity="0.4"/>
            <rect x="210" y="75" width="20" height="20" fill="var(--peri)" opacity="0.4"/>`,
          item:{ name:"A Wall of Kids' Drawings", lines:[
            "Ships, stars, one confident crayon rendering of what might be the ⟧SHIP⟨ herself, if you squint.",
            "One drawing is captioned 'my favorite planet' and depicts, unmistakably, this exact schoolhouse.",
            "One drawing depicts the away team with remarkable, slightly unflattering accuracy.",
            "A caption under a star-shaped scribble reads 'this is space, probably.' Hard to argue.",
            "The newest drawing, still slightly wet, shows a ship that looks a lot like the ⟧SHIP⟨."
          ]}},
        farms:{ name:'Terraced Farms', color:'var(--amber)',
          desc:"Rows climbing the hillside outside the settlement, irrigation channels catching the afternoon light.",
          ambient:"A farmer offers a taste of whatever's ripening. Nobody on the crew has the vocabulary to describe the flavor.",
          scene:`<rect width="320" height="160" fill="#140f0a"/>
            <path d="M0,140 L100,60 L200,140 Z" fill="var(--sage)" opacity="0.2"/>
            <path d="M120,140 L220,80 L320,140 Z" fill="var(--sage)" opacity="0.25"/>`,
          item:{ name:'An Irrigation Terrace Marker', lines:[
            "A hand-carved post marking which family tends which row. Generations of names, worn smooth from touching.",
            "The newest name is barely a year old. The colony keeps growing, one row at a time.",
            "A faint groove worn into the marker suggests generations of hands resting there while checking the water flow.",
            "The names carved into it are in at least three different styles of handwriting, spanning decades.",
            "Someone's added a small, recent notch with no name at all. Not finished yet, maybe."
          ]}}
      }
    },
    mining:{
      name:'Kelder Belt Mining Colony', tag:'Mining', color:'var(--gold)',
      blurb:"A working colony carved into the Kelder Belt's rock — the same convoy you once defended calls this place home.",
      risk:'Low', time:'~10 min',
      locations:{
        shaft:{ name:'Main Shaft', color:'var(--gold)',
          desc:"A vertical bore descending deep into the asteroid, lift cars rattling up and down on a schedule nobody questions.",
          ambient:"A miner recognizes the ship and mentions, almost offhand, that the convoy still talks about that skirmish.",
          scene:`<rect width="320" height="160" fill="#100c08"/>
            <rect x="140" y="10" width="40" height="140" fill="var(--gold)" opacity="0.15"/>
            <rect x="145" y="60" width="30" height="20" fill="var(--gold)" opacity="0.4"/>`,
          item:{ name:'A Shift Schedule Board', lines:[
            "Names and hours, chalked and rechalked so many times the board is more residue than surface at this point.",
            "One name is circled with a small drawn star. Employee of the month, maybe, or just someone well-liked.",
            "A name near the top has 'ask about the skirmish' scrawled next to it. Kade, presumably.",
            "The board's covered in more chalk dust than actual visible schedule at this point.",
            "One shift slot is marked 'volunteers only.' Apparently that's a popular one."
          ]}},
        refinery:{ name:'Ore Refinery', color:'var(--gold)', service:'refuel',
          desc:"Loud, hot, and constant — raw ore going in one end, something usable coming out the other, glimmerite among it.",
          ambient:"Oskar is having what can only be described as a religious experience near the smelting rig.",
          scene:`<rect width="320" height="160" fill="#100c08"/>
            <rect x="60" y="70" width="200" height="60" rx="4" fill="var(--gold)" opacity="0.15"/>
            <circle cx="160" cy="100" r="20" fill="var(--amber)" opacity="0.4"/>`,
          item:{ name:'A Tray of Fresh-Refined Glimmerite', lines:[
            "Still warm, faintly glowing. The foreman offers a sample without a second thought — this place has plenty.",
            "Talia's already asking about a standing trade arrangement. Some things never change.",
            "The pieces catch the light differently depending on the angle, a faint shimmer that isn't quite uniform.",
            "A hand-written tag reads 'good batch, don't sell this one cheap.' Rell would disagree.",
            "The tray's still warm from the refining process. Handling it carefully seems wise."
          ]}},
        habring:{ name:'Habitation Ring', color:'var(--gold)',
          desc:"Living quarters built into the rock itself, warm light spilling from windows carved rather than framed.",
          ambient:"Someone's strung actual string lights along a corridor. It looks a lot like the ones in the crew quarters back home.",
          scene:`<rect width="320" height="160" fill="#100c08"/>
            <path d="M20,80 Q160,40 300,80 L300,140 Q160,110 20,140 Z" fill="var(--gold)" opacity="0.12"/>
            <circle cx="80" cy="95" r="4" fill="var(--gold)" opacity="0.6"/>
            <circle cx="160" cy="85" r="4" fill="var(--gold)" opacity="0.6"/>
            <circle cx="240" cy="95" r="4" fill="var(--gold)" opacity="0.6"/>`,
          item:{ name:"A Family's Carved Doorframe", lines:[
            "Names and heights marked into the stone over what must be years. A whole life measured in small notches.",
            "A newer notch sits well below the rest. Someone's grown up a lot since the mark above it.",
            "A small, uneven heart is scratched near the bottom, clearly added by someone very young, a long time ago.",
            "The most recent name is barely a year old, the carving still sharp-edged and fresh.",
            "A faded ribbon is tied around the frame, the color long since bleached out by rock-dust and time."
          ]}},
        overlook:{ name:'Belt Overlook', color:'var(--gold)',
          desc:"A viewport cut into the rock face, looking out over the drifting field of asteroids the colony calls home.",
          ambient:"You can just make out other mining rigs in the distance, scattered lights against the dark.",
          scene:`<rect width="320" height="160" fill="#050403"/>
            <circle cx="80" cy="60" r="14" fill="var(--gold)" opacity="0.3"/>
            <circle cx="180" cy="90" r="10" fill="var(--gold)" opacity="0.25"/>
            <circle cx="240" cy="50" r="8" fill="var(--gold)" opacity="0.3"/>`,
          item:{ name:'A Hand-Etched Star Chart', lines:[
            "Every claimed rock in the belt, marked and labeled by hand. This colony knows this field better than any sensor array.",
            "One unclaimed rock is circled with a question mark. Something about it's caught their attention too.",
            "A small cluster of rocks near the edge is marked simply 'trouble.' No further explanation offered.",
            "The etching style changes partway across the chart, like a second hand picked up where the first left off.",
            "One unclaimed rock circled in the corner has a tiny question mark next to it. Still unclaimed, still curious."
          ]}}
      }
    },
    medical:{
      name:'Halcyon Medical Station', tag:'Medical', color:'var(--sage)',
      blurb:"A quiet quarantine and research station. Dr. Amara practically lit up when the assignment came through.",
      risk:'Minimal', time:'~10 min',
      locations:{
        triage:{ name:'Triage Bay', color:'var(--sage)',
          desc:"Calm, orderly, quieter than the word 'quarantine' implies. Most of the beds sit empty today.",
          ambient:"A staff member greets Dr. Amara by name. Apparently this isn't her first visit.",
          scene:`<rect width="320" height="160" fill="#0a120e"/>
            <rect x="40" y="90" width="60" height="30" rx="6" fill="var(--sage)" opacity="0.2"/>
            <rect x="130" y="90" width="60" height="30" rx="6" fill="var(--sage)" opacity="0.2"/>
            <rect x="220" y="90" width="60" height="30" rx="6" fill="var(--sage)" opacity="0.2"/>`,
          item:{ name:'An Intake Ledger', lines:[
            "Mostly minor cases, logged and resolved within days. Whatever this station handles, it handles well.",
            "Dr. Amara flips through a few pages with obvious professional respect. High praise, from her.",
            "Most entries are resolved within a day. The exceptions are rare enough to stand out clearly.",
            "A margin note reads 'ask before assuming.' General advice, apparently, applied consistently.",
            "The handwriting shifts between at least two different staff members, both equally neat."
          ]}},
        wards:{ name:'Recovery Wards', color:'var(--sage)',
          desc:"Long, sunlit rooms, patients reading or dozing or playing slow card games with visiting family.",
          ambient:"Someone's set up a small aquarium in the corner. Entirely unnecessary, entirely appreciated.",
          scene:`<rect width="320" height="160" fill="#0a120e"/>
            <rect x="30" y="40" width="260" height="10" fill="var(--sage)" opacity="0.3"/>
            <rect x="60" y="70" width="50" height="30" rx="4" fill="var(--sage)" opacity="0.2"/>
            <rect x="210" y="70" width="50" height="30" rx="4" fill="var(--sage)" opacity="0.2"/>`,
          item:{ name:'A Patient Recreation Shelf', lines:[
            "Games, books, one suspiciously well-loved deck of cards missing at least four cards nobody's replaced.",
            "A hand-written sign asks patients to 'please return games when finished.' Someone's clearly given up enforcing it.",
            "A jigsaw puzzle sits half-finished, abandoned mid-picture, the box nowhere in sight.",
            "A worn paperback has a bookmark exactly two-thirds of the way through. Someone will finish it eventually.",
            "A hand-drawn tic-tac-toe board is scratched into the shelf's underside. Ongoing, apparently, and close."
          ]}},
        lab:{ name:'Research Lab', color:'var(--sage)',
          desc:"Clean, quiet, humming with equipment. Whatever they're studying here, they take it seriously.",
          ambient:"Dr. Amara and a station researcher have already lapsed into a conversation nobody else can follow.",
          scene:`<rect width="320" height="160" fill="#0a120e"/>
            <rect x="80" y="50" width="160" height="70" rx="6" fill="var(--sage)" opacity="0.15" stroke="var(--sage)" stroke-width="2"/>
            <circle cx="160" cy="85" r="14" fill="var(--peri)" opacity="0.4"/>`,
          item:{ name:'A Sample Storage Rack', lines:[
            "Neatly labeled vials, most routine, one flagged for follow-up with a note that just says 'ask the ⟧SHIP⟨.'",
            "Dr. Amara reads the note twice, quiet for a moment, then asks to take a copy of the file back with her.",
            "Most vials are labeled in careful shorthand. A few are labeled with just a question mark.",
            "One sample's temperature log shows a small, unexplained spike three days ago. Already flagged for review.",
            "The rack hums faintly, the only sound in an otherwise very quiet room."
          ]}},
        greenhouse:{ name:'Hydroponics Greenhouse', color:'var(--sage)',
          desc:"Rows of medicinal plants under warm grow-lights, the air thick and green in a way that feels like relief.",
          ambient:"Dr. Amara says this is her favorite part of any medical station. It shows.",
          scene:`<rect width="320" height="160" fill="#0a120e"/>
            <rect x="20" y="60" width="280" height="10" fill="var(--gold)" opacity="0.3"/>
            <rect x="40" y="80" width="50" height="40" fill="var(--sage)" opacity="0.3"/>
            <rect x="140" y="80" width="50" height="40" fill="var(--sage)" opacity="0.3"/>
            <rect x="240" y="80" width="50" height="40" fill="var(--sage)" opacity="0.3"/>`,
          item:{ name:'A Row of Labeled Cuttings', lines:[
            "Medicinal plants, carefully tracked from seed to harvest. A few labels reference conditions the ship's database doesn't recognize.",
            "Dr. Amara asks, very casually, whether a few cuttings might be available to take home. Fen's arboretum is about to get interesting.",
            "A few plants have tags reading 'do not ask, just admire.' A running joke, presumably, or a real warning.",
            "One cutting's clearly newer than the rest, its tag still slightly damp with fresh ink.",
            "The air here is noticeably warmer and greener-smelling than the rest of the station."
          ]}}
      }
    },
    aldergrove:{
      name:'Aldergrove', tag:'Isolationist', color:'var(--peri)',
      blurb:"A civilization that knows exactly what's out there — and chose, deliberately, not to be part of it.",
      risk:'Low', time:'~10 min', requires:{type:'flag', flag:'aldergroveDetected'},
      locations:{
        outskirts:{ name:'The Outskirts', color:'var(--peri)',
          desc:"The shuttle sets down in an open field just beyond the settlement's edge — not hidden, not hard to find, just polite distance. Whoever laid this out expected visitors to land exactly here.",
          ambient:"A worn path leads toward the settlement. It's been walked a long time, but not recently rushed.",
          scene:`<rect width="320" height="160" fill="#0a0f14"/>
            <path d="M40,140 Q160,110 280,140" stroke="var(--peri)" stroke-width="2" opacity="0.3" fill="none"/>
            <ellipse cx="230" cy="120" rx="14" ry="6" fill="var(--peri)" opacity="0.3"/>`,
          item:{ name:'A Simple Waystone', lines:[
            "Carved symbols mark the stone, weathered smooth by years of hands passing over them. A greeting, maybe. Or a boundary. Possibly both.",
            "The stone's positioned exactly where the path bends into view of the settlement — deliberate, like a doorbell nobody built.",
            "Nothing about it feels hostile. It just feels like someone, a long time ago, decided visitors should know they'd arrived somewhere, not stumbled into it.",
            "Wren traced the carving pattern against nothing in the ship's database. Not because it's alien — because it's clearly, plainly, just theirs.",
            "A small offering of dried flowers sits at the base, recently placed. Someone still tends this."
          ]}},
        settlement:{ name:'The Settlement', color:'var(--peri)',
          desc:"Ordinary. That's the first thing anyone notices. Homes, a market square, people going about a day that looks, in every visible way, like a day anywhere else.",
          ambient:"A few residents glance up, unbothered, and go back to what they were doing.",
          scene:`<rect width="320" height="160" fill="#0a0f14"/>
            <rect x="50" y="80" width="50" height="45" fill="var(--peri)" opacity="0.2"/>
            <rect x="140" y="70" width="55" height="55" fill="var(--peri)" opacity="0.25"/>
            <rect x="230" y="85" width="45" height="40" fill="var(--peri)" opacity="0.2"/>`,
          item:{ name:'A Communal Notice Board', lines:[
            "Announcements, mostly mundane — a shared harvest, a repair schedule. One notice, near the bottom, references an 'outside contact protocol.' Filed like any other chore.",
            "A child's drawing is pinned up: two suns, a ship, and a very confident stick-figure wave. Not fear. Just acknowledgment.",
            "Someone's posted a rotating 'watch' schedule, unrelated to any threat — just a role, taken in turns, like tending a garden.",
            "A faded notice references a visitor from 'many years past.' No further detail. The community remembers, evidently, without dwelling on it.",
            "Nothing on the board suggests secrecy. It suggests a choice, made a long time ago, and never revisited with any anxiety."
          ]}},
        archive:{ name:'The Archive', color:'var(--peri)',
          desc:"A quiet, unassuming building holding what turns out to be centuries of careful record-keeping — including, unmistakably, knowledge of the wider galaxy.",
          ambient:"Nobody guards this place. Nobody needs to.",
          scene:`<rect width="320" height="160" fill="#0a0f14"/>
            <rect x="90" y="50" width="140" height="80" rx="4" fill="var(--peri)" opacity="0.15" stroke="var(--peri)" stroke-width="2"/>
            <circle cx="160" cy="90" r="10" fill="var(--gold)" opacity="0.4"/>`,

  function bindTransporter(){
    document.getElementById('transporter-say-hi').addEventListener('click', ()=>{
      const line = transporterChief.lines[Math.floor(Math.random()*transporterChief.lines.length)];
      document.getElementById('transporter-say-hi-result').textContent = line;
    });
    document.getElementById('transporter-examine').addEventListener('click', async ()=>{
      const line = transporterItem.lines[Math.floor(Math.random()*transporterItem.lines.length)];
      document.getElementById('transporter-examine-result').textContent = line;
      if(!shipState.awayKeepsakes) shipState.awayKeepsakes = {};
      if(!shipState.awayKeepsakes['transporter:bufferlog']){
        shipState.awayKeepsakes['transporter:bufferlog'] = true;
        await saveShipState();
        const infoEl = document.querySelector('#transporter-examine').previousElementSibling;
        if(infoEl && !infoEl.querySelector('.cp-collected')){
          infoEl.innerHTML += ' <span class="cp-collected">★ Collected</span>';
        }
      }
    });
    if(!usedToday('transporter:energize')){
      const checkDials = ()=>{
        const inZone = v => v>=40 && v<=60;
        const b = parseInt(document.getElementById('dial-buffer').value,10);
        const ph = parseInt(document.getElementById('dial-phase').value,10);
        const c = parseInt(document.getElementById('dial-beam').value,10);
        document.getElementById('dial-buffer-val').textContent = b;
        document.getElementById('dial-buffer-val').style.color = inZone(b) ? 'var(--sage)' : 'var(--rose)';
        document.getElementById('dial-phase-val').textContent = ph;
        document.getElementById('dial-phase-val').style.color = inZone(ph) ? 'var(--sage)' : 'var(--rose)';
        document.getElementById('dial-beam-val').textContent = c;
        document.getElementById('dial-beam-val').style.color = inZone(c) ? 'var(--sage)' : 'var(--rose)';
        document.getElementById('energize-btn').disabled = !(inZone(b) && inZone(ph) && inZone(c));
      };
      ['dial-buffer','dial-phase','dial-beam'].forEach(id=>{
        document.getElementById(id).addEventListener('input', checkDials);
      });
      document.getElementById('energize-btn').addEventListener('click', async ()=>{
        const line = transporterEnergizeLines[Math.floor(Math.random()*transporterEnergizeLines.length)];
        document.getElementById('energize-result').textContent = line;
        await grantRoomReward({power:2}, 'Transporter calibration', line, 'transporter:energize');
        document.getElementById('energize-btn').disabled = true;
        document.getElementById('energize-btn').textContent = 'Already done today';
      });
    }
  }

  function renderAwayTeam(){
    const availablePlanets = Object.entries(planetData).filter(([key,p])=>requirementMet(p.requires) && !p.holodeckOnly);
    const cards = availablePlanets.map(([key,p])=>`
      <div class="m-card ${isMissionTargetPlanet(key) ? 'mission-active' : ''}" style="--tag-color:${p.color}" data-planet="${key}">
        <span class="tag" style="background:${p.color}">${p.tag}</span>
        <h3>${p.name}</h3><p>${p.blurb}</p>
        <div class="meta"><span>Risk: ${p.risk}</span><span>${p.time}</span></div>
      </div>`).join('');
    content.innerHTML = `
      ${spatialBannerHTML()}
      ${episodeStripHTML()}
      <div class="board-head"><span class="label">Away Team Destinations</span><span>${availablePlanets.length} destination${availablePlanets.length===1?'':'s'}</span></div>
      <div class="missions" id="planet-cards">${cards}</div>
      <div style="margin-top:24px;">${transporterHTML()}</div>

    bindSpatialBanner();
    bindEpisodeStrip();

    document.querySelectorAll('#planet-cards [data-planet]').forEach(card=>{
      card.addEventListener('click', ()=>renderPlanet(card.dataset.planet));

  }

            const line = "The crew takes a proper afternoon off — no schedules, no shifts, just a beach and a tide that isn't in a hurry. Everyone comes back a little lighter.";
            resultEl.textContent = line + ' (+8 Morale)';
            btn.disabled = true; btn.textContent = 'Already taken today';
            await grantRoomReward({morale:8}, 'Shore Leave', line, 'corvale:resort');
          } else {
            const cost = svc.cost;
            const statKey = svc.stat;
            if(shipState.glimmerite < cost){
              resultEl.textContent = `Not enough Glimmerite — need ${cost}, have ${shipState.glimmerite}.`;
              return;
            }
            if(shipState[statKey] >= 100){
              resultEl.textContent = `${statKey==='hull'?'Hull':'Power'} is already at full — nothing to fix here right now.`;

            shipState.glimmerite -= cost;

            const line = l.service==='repair'

            await saveShipState();
          }
        });
      }

  // small canvas silhouettes drawn on the bridge viewscreen to match the current/hovered state
  function drawViewIcon(ctx, w, h, icon, t){
    if(!icon) return;
    const scale = devicePixelRatio * (w/600);
    const cx = w*0.7, cy = h*0.6;
    ctx.save();
    if(icon==='asteroid'){
      const rocks = [[0,0,14],[18,-8,9],[-14,10,8],[10,14,7]];
      rocks.forEach(([dx,dy,r],i)=>{
        const bob = Math.sin(t*0.6+i)*3;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(217,139,146,0.35)';
        ctx.arc(cx+dx*scale, cy+dy*scale+bob, r*scale, 0, Math.PI*2);
        ctx.fill();
      });
    } else if(icon==='station'){
      const s = 22*scale;
      ctx.translate(cx,cy);
      ctx.rotate(t*0.05);
      ctx.strokeStyle = 'rgba(232,166,77,0.5)';
      ctx.lineWidth = 2*devicePixelRatio;
      ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s*1.4,0); ctx.lineTo(s*1.4,0); ctx.moveTo(0,-s*1.4); ctx.lineTo(0,s*1.4); ctx.stroke();
      ctx.fillStyle='rgba(242,200,121,0.6)';
      ctx.beginPath(); ctx.arc(0,0,s*0.25,0,Math.PI*2); ctx.fill();
    } else if(icon==='ship'){
      const s = 16*scale;
      const drift = Math.sin(t*0.4)*4;
      ctx.translate(cx, cy+drift);
      ctx.fillStyle = 'rgba(140,158,219,0.55)';
      ctx.beginPath();
      ctx.moveTo(s*1.3,0); ctx.lineTo(-s*0.8,s*0.5); ctx.lineTo(-s*0.4,0); ctx.lineTo(-s*0.8,-s*0.5);
      ctx.closePath(); ctx.fill();
    } else if(icon==='ore'){
      const bits = [[0,0],[14,-10],[-12,8]];
      bits.forEach(([dx,dy],i)=>{
        const tw = 0.5+0.5*Math.sin(t*1.2+i*2);
        ctx.save();
        ctx.translate(cx+dx*scale, cy+dy*scale);
        ctx.rotate(Math.PI/4);
        ctx.fillStyle = `rgba(242,200,121,${0.3+tw*0.4})`;
        const s = 6*scale;
        ctx.fillRect(-s/2,-s/2,s,s);
        ctx.restore();
      });
    } else if(icon==='planet'){
      const s = 20*scale;
      ctx.translate(cx,cy);
      const grad = ctx.createRadialGradient(-s*0.3,-s*0.3,0,0,0,s);
      grad.addColorStop(0,'rgba(156,184,143,0.5)');
      grad.addColorStop(1,'rgba(156,184,143,0.1)');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(156,184,143,0.35)';
      ctx.lineWidth=1.5*devicePixelRatio;
      ctx.beginPath(); ctx.ellipse(0,0,s*1.6,s*0.4,-0.3,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  // a stage's `loc` is either a plain ship-room key ('ready') or a composite away key ('thessaly:ruins').

    if(locKey.indexOf(':') !== -1){

      const parts = locKey.split(':');

  // location the current episode chapter's next step points to, when it has one (some steps,

  function getEpisodeTargetLoc(){

  function isMissionTarget(key){

  // returns true if the active spatial mission's (or episode chapter's) target location is anywhere within this planet

  async function completeSpatialMission(){
    if(!activeSpatial) return;
    if(activeSpatial.key === 'signalCh4'){

    if(activeSpatial.key === 'signalCh5'){

      ? "Wren set up games in the Observation Lounge, Corvo's idea. It worked — even the stiffest Concord delegate cracked a smile over cards."
      : "Wren set up a quiet corner for real conversation. Calmer, but just as warm.";
    const finalLine = "Rook did a final walk-through and confirmed: everyone's ready.";

    const deltas = {
      galley: a.galley==='grand' ? {morale:2, power:-1} : {power:1},
      cargo: a.cargo==='formal' ? {glimmerite:-1, morale:2} : {morale:1},
      obs: a.obs==='games' ? {morale:2} : {morale:1},
      bridge: {morale:1}
    };
    const totals = {

    shipState.power = clamp(shipState.power + totals.power);

      outcomeLine = "The purge is quick, clean, and quiet — no dramatic shutdown, just an idle grid going properly idle. Mira (Conn Officer) is visibly relieved. Wren (Science Officer) doesn't argue, but she doesn't quite look at the empty archway either.";
    } else if(choice==='isolate'){
      outcomeFlag = 'holodeckIsolated';
      outcomeLine = "The system stays, sealed off and monitored, studied rather than trusted or destroyed. Oskar (Chief Engineer) seems genuinely relieved by the compromise — not an answer, exactly, but a way to keep asking the question without anyone else getting hurt finding it out.";
    } else {
      outcomeFlag = 'holodeckAllowed';
      outcomeLine = "Nobody purges anything. The system stays exactly as it's chosen to be, and the crew agrees, uneasily, to see what it actually becomes. Wren (Science Officer) doesn't try to hide how pleased she is. Mira (Conn Officer) doesn't look thrilled, but she doesn't object either.";
    }

    if(!shipState.storyFlags) shipState.storyFlags = {};
    shipState.storyFlags[outcomeFlag] = true;
    shipState.storyFlags.holodeckResolved = true;
    shipState.completed.holoCh4 = (shipState.completed.holoCh4||0) + 1;

    const lines = [outcomeLine, `Episode Four is complete. Whatever it actually was, it's no longer a mystery aboard the ${shipDisplayName()} — just a decision the crew has to live with now, one way or another.`];
    shipState.log.unshift({ t:Date.now(), title:"What It's Become", lines, totals:{} });

    completedSpatialSummary = { title:"What It's Become", lines, totals:{} };
    activeSpatial = null;
    activeMissionContext = null;
    try{
      await saveShipState();
    }catch(e){
      console.error("Failed to save after completing What It's Become:", e);
    }
    renderDeck('bridge');
  }

        "Dez insists it's 'temporary.' It's been temporary for a very long time.",
        "There's a small hand-written label next to it: 'do not remove — load-bearing.'",
        "A second, smaller patch has appeared nearby. Dez insists it's 'unrelated.' Nobody believes him.",
        "The repair's held through at least two rough landings so far. Impressive, honestly, however it looks."
      ], contextLines:{} },
      arboretum:{ name:"The Escaped Fern's Offshoot", lines:[
        "A cutting from the Ready Room fern, thriving here with room to actually spread out.",
        "It's twice the size of its parent plant now. There may be a rivalry.",
        "Fen's given it its own little corner, like a minor celebrity among the tomatoes.",
        "It's started producing tiny flowers the original never has. Fen's very proud, like a parent at a recital.",
        "A small handwritten tag reads 'FERN JR.' Someone on this crew has a sense of humor."
      ], contextLines:{} },
      lounge:{ name:'The Ex-Navigator-Shaped Hole', lines:[
        "A dartboard-adjacent hole in the wall, suspiciously body-shaped. Nobody explains it. Everybody knows.",
        "Bas patched it once. It reappeared within a week. The story stays the same either way.",
        "Corvo still aims for the same spot, missing on purpose, out of respect.",
        "Someone's taped a target outline around the hole, officially incorporating it into the game.",
        "The hole has, unofficially, become good luck. Nobody hits it on purpose anymore. Everyone still tries."
      ], contextLines:{} }
    };

    function getItemLines(key){
      const item = itemData[key];
      return item ? pickLines(item) : null;
    }

    function itemHTML(key){
      const item = itemData[key];
      if(!item) return '';
      const collected = shipState.keepsakes && shipState.keepsakes[key];
      return `
        <div class="supp-crew" id="item-block-${key}">
          <div class="cp-heading" style="opacity:0.75;">Worth a look</div>
          <div class="cp-info" id="item-info-${key}"><b>${item.name}</b>${collected ? ' <span class="cp-collected">★ Collected</span>' : ''}</div>
          <button class="ghost-btn small" id="item-examine-${key}" style="margin-top:6px;">Examine</button>
          <div class="cp-result" id="item-result-${key}"></div>
        </div>`;
    }

    function crewInRoom(key){
      return Object.entries(crewData).filter(([ck,c])=>c.room===key);
    }

    function renderCrewBlock(ck, overrides){
      overrides = overrides || {};
      const c = crewData[ck];
      const rap = (shipState.rapport && shipState.rapport[ck]) || 0;
      const talkDone = usedToday('crew:'+ck);
      const favorUnlocked = rap >= 50;
      const favorDone = usedToday('favor:'+ck);
      const milestoneReached = shipState.milestones && shipState.milestones[ck];
      const favorLabel = favorUnlocked ? favorConfig[ck].label : 'Favor unlocks at Trusted (50 rapport)';
      const favorBtnLabel = !favorUnlocked ? 'Locked' : (favorDone ? 'Asked today' : 'Ask');
      const giftDone = usedToday('gift:'+ck);
      const canAffordGift = shipState.glimmerite >= GIFT_COST;
      const giftBtnLabel = giftDone ? 'Given today' : (canAffordGift ? 'Give' : `Need ${GIFT_COST} ✨`);
      return `
        <div class="cp-block" id="cp-block-${ck}">
          <div class="cp-row">
            <div class="cp-info"><b>${c.name}</b> — ${c.role}<div class="cp-rapport" id="cp-rapport-${ck}">${rapportTier(rap)} · Rapport ${rap}/100</div></div>
            <button class="ghost-btn small" data-crew="${ck}" data-action="talk" ${talkDone?'disabled':''}>${talkDone?'Talked today':'Talk'}</button>
          </div>
          <div class="cp-result" id="cp-result-talk-${ck}">${overrides.talkResult||''}</div>
          <div class="cp-row">
            <div class="cp-info" style="font-size:11px;color:var(--dim);">${favorLabel}</div>
            <button class="ghost-btn small" data-crew="${ck}" data-action="favor" ${(!favorUnlocked||favorDone)?'disabled':''}>${favorBtnLabel}</button>
          </div>
          <div class="cp-result" id="cp-result-favor-${ck}">${overrides.favorResult||''}</div>
          <div class="cp-row">
            <div class="cp-info" style="font-size:11px;color:var(--dim);">Give a glimmerite keepsake (${GIFT_COST} ✨)</div>
            <button class="ghost-btn small" data-crew="${ck}" data-action="gift" ${(giftDone||!canAffordGift)?'disabled':''}>${giftBtnLabel}</button>
          </div>
          <div class="cp-result" id="cp-result-gift-${ck}">${overrides.giftResult||''}</div>
          ${milestoneReached ? `<div class="cp-milestone">🤝 Close Friend milestone reached</div>` : ''}
        </div>`;
    }

    function crewHTML(key){
      const stationed = crewInRoom(key);
      if(!stationed.length) return '';
      const blocks = stationed.map(([ck])=>renderCrewBlock(ck)).join('');
      return `<div class="crew-present"><div class="cp-heading">Crew here</div><div id="crew-present-list">${blocks}</div></div>`;
    }

    function bindCrewButtons(){
      const container = document.getElementById('crew-present-list');
      if(!container) return;
      container.addEventListener('click', async (e)=>{
        const btn = e.target.closest('[data-crew]');
        if(!btn || btn.disabled) return;
        const ck = btn.dataset.crew;
        const action = btn.dataset.action;
        btn.disabled = true;
        let line, overrideKey;
        if(action==='talk'){
          line = pickLines(crewData[ck])[Math.floor(Math.random()*pickLines(crewData[ck]).length)];
          await grantCrewTalk(ck, line);
          overrideKey = 'talkResult';
        } else if(action==='favor'){
          line = favorConfig[ck].lines[Math.floor(Math.random()*favorConfig[ck].lines.length)];
          await grantFavor(ck, line);
          overrideKey = 'favorResult';
        } else {
          line = giftConfig[ck].lines[Math.floor(Math.random()*giftConfig[ck].lines.length)];
          await grantGift(ck, line);
          overrideKey = 'giftResult';
        }
        const blockEl = document.getElementById('cp-block-'+ck);
        if(blockEl){
          blockEl.outerHTML = renderCrewBlock(ck, {[overrideKey]:line});
        }
      });
    }

    function showRoom(key, el){
      const r = rooms[key];
      document.querySelectorAll('.room').forEach(x=>x.classList.remove('active'));
      if(el) el.classList.add('active');
      const isHolodeck = key==='holodeck';
      const actions = roomActionConfig[key];
      let extraHTML = '';
      function holoLaunchHTML(idx){
        const p = holoPrograms[idx];
        if(!p.launch) return `<div style="font-size:10.5px;color:var(--dim);margin-top:8px;">Pure atmosphere — nothing to launch here, just enjoy the scenery.</div>`;
        const labels = { flight:'Launch Flight Simulation', away:'Launch Away Simulation', awayLocation:'Launch Away Simulation', mission:'Launch Mission Simulation' };
        return `
          <button class="primary-btn" id="holo-launch" style="margin-top:10px;">${labels[p.launch.type]}</button>
          <div style="font-size:10px;color:var(--dim);margin-top:6px;">Holographic simulation — plays out just like the real thing.</div>`;
      }
      function bindHoloLaunch(){
        const btn = document.getElementById('holo-launch');
        if(!btn) return;
        btn.addEventListener('click', ()=>{
          const p = holoPrograms[holoIndex];
          if(!p.launch) return;
          holoOrigin = p.name;
          if(p.launch.type==='flight') startFlight(p.launch.craft, p.launch.obj);
          else if(p.launch.type==='away') renderPlanet(p.launch.planet);
          else if(p.launch.type==='awayLocation') renderPlanet(p.launch.planet, p.launch.location);
          else if(p.launch.type==='mission') startMission(p.launch.id);
        });
      }
      if(isHolodeck){
        extraHTML = `
          <div style="margin-top:12px;">
            <div class="cp-heading">Select a program</div>
            <div class="holo-grid" id="holo-grid">
              ${holoPrograms.map((p,i)=>`
                <button class="holo-chip ${i===holoIndex?'active':''}" data-holo="${i}">
                  <span class="hc-icon">${p.icon}</span><span>${p.name}</span>
                </button>`).join('')}
            </div>
            <div id="holo-launch-area">${holoLaunchHTML(holoIndex)}</div>
          </div>`;
      } else if(actions){
        const plainActions = actions.filter(a=>!a.minigame);
        extraHTML = plainActions.map(a=>{
          const cd = key+':'+a.id;
          const already = usedToday(cd);
          const isEpisodeTarget = (key+':'+a.id) === getEpisodeTargetAction();
          if(isEpisodeTarget && !already){
            return `
            <div class="quick-launch" style="margin-top:12px;">
              <div class="cp-heading" style="color:var(--gold);opacity:1;">📖 Episode 01 — Next Step</div>
              <button class="primary-btn" id="room-action-btn-${a.id}" style="margin-top:6px;">${a.label}</button>
              <div id="room-action-result-${a.id}" style="margin-top:8px;font-size:11px;color:var(--gold);min-height:14px;"></div>
            </div>`;
          }
          return `
          <div style="margin-top:12px;">
            <button class="ghost-btn" id="room-action-btn-${a.id}" style="margin-right:0;" ${already?'disabled':''}>${already ? 'Already done today' : a.label}</button>
            <div id="room-action-result-${a.id}" style="margin-top:8px;font-size:11px;color:var(--gold);min-height:14px;"></div>
          </div>`;
        }).join('');
      }
      const miniActions = actions ? actions.filter(a=>a.minigame) : [];
      const minigameHTML = miniActions.map(a=>{
        const cd = key+':'+a.id;
        const already = usedToday(cd);
        const icon = a.minigame==='stabilize' ? '🎛️' : a.minigame==='diagnostics' ? '🩺' : a.minigame==='sync' ? '🔄' : a.minigame==='reroute' ? '🔌' : '🎮';
        return `
          <div class="quick-launch">
            <div class="cp-heading" style="color:var(--gold);opacity:1;">${icon} ${a.label}</div>
            <button class="primary-btn" id="room-action-btn-${a.id}" style="margin-top:8px;" ${already?'disabled':''}>${already ? 'Already done today' : 'Begin'}</button>
            <div id="room-action-result-${a.id}" style="margin-top:8px;font-size:11px;color:var(--dim);min-height:14px;"></div>
          </div>`;
      }).join('');
      const quickLaunchConfig = {
        bridge:{ heading:'🚀 Ready to Fly', items:[
          { id:'helm', label:'Take the Helm', sub:'Jump to Flight Deck, starship pre-selected.', go:()=>renderObjectiveSelect('starship') }
        ]},
        shuttle:{ heading:'🚀 Ready to Fly', items:[
          { id:'board', label:'Board the Shuttle', sub:'Jump to Flight Deck, shuttle pre-selected.', go:()=>renderObjectiveSelect('shuttle') }
        ]},
        obs:{ heading:'🔭 Ready to Scan', items:[
          { id:'anomaly', label:'Begin Anomaly Survey', sub:"Launch straight into the starship's anomaly-scanning objective.", go:()=>startFlight('starship','anomaly') }
        ]},
        cargo:{ heading:'📦 Ready to Ship', items:[
          { id:'quickdel', label:'Quick Delivery (Shuttle)', sub:'Load a single crate, choose a destination.', go:()=>renderDestinationSelect('shuttle','cargo') },
          { id:'bulksup', label:'Bulk Supply Run (Starship)', sub:'Consolidate from three depots, deliver in bulk.', go:()=>renderDestinationSelect('starship','supply') }
        ]},
        medbay:{ heading:'🩺 Ready to Respond', items:[
          { id:'evac', label:'Begin Emergency Evac', sub:"Launch straight into the starship's evac objective.", go:()=>startFlight('starship','evac') }
        ]}
      };
      const ql = quickLaunchConfig[key];
      const quickLaunchHTML = ql ? `
        <div class="quick-launch">
          <div class="cp-heading" style="color:var(--gold);opacity:1;">${ql.heading}</div>
          ${ql.items.map(it=>`
            <button class="primary-btn" id="quick-launch-btn-${it.id}" style="margin-top:8px;margin-right:8px;">${it.label}</button>
            <div style="font-size:10px;color:var(--dim);margin:4px 0 8px;">${it.sub}</div>
          `).join('')}
        </div>` : '';
      let overviewHTML = '';
      if(key==='ready'){
        const missions = Object.values(shipState.completed||{}).reduce((a,b)=>a+b,0);
        const shipKeepsakes = Object.values(shipState.keepsakes||{}).filter(Boolean).length;
        const awayKeepsakes = Object.values(shipState.awayKeepsakes||{}).filter(Boolean).length;
        const closeFriends = Object.values(shipState.milestones||{}).filter(Boolean).length;
        const leads = getActiveLeads();
        const tabsHTML = `
          <div style="display:flex;gap:6px;margin:10px 0 12px;">
            <button class="filter-pill ${readyRoomTab==='overview'?'active':''}" data-rr-tab="overview">Overview</button>
            <button class="filter-pill ${readyRoomTab==='rapport'?'active':''}" data-rr-tab="rapport">Crew Rapport</button>
          </div>`;
        let tabBodyHTML = '';
        if(readyRoomTab==='overview'){
          tabBodyHTML = `
            <div class="meters" style="margin-top:0;margin-bottom:0;">
              <div class="meter"><div class="m-top"><span class="m-name">Missions</span><span class="m-val">${missions}</span></div></div>
              <div class="meter"><div class="m-top"><span class="m-name">Keepsakes</span><span class="m-val">${shipKeepsakes+awayKeepsakes}</span></div></div>
              <div class="meter"><div class="m-top"><span class="m-name">Close Friends</span><span class="m-val">${closeFriends}/${Object.keys(crewData).length}</span></div></div>
            </div>
            <div style="margin-top:14px;">
              <div class="cp-heading">Active Leads</div>
              ${leads.length ? leads.map(l=>`
                <div style="margin-bottom:8px;">
                  <div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:2px;">${l.name}</div>
                  <div style="font-size:11px;color:var(--cream);line-height:1.5;">${l.text}</div>
                </div>
              `).join('') : `<div style="font-size:11px;color:var(--dim);">Nothing on the radar yet. Keep exploring.</div>`}
            </div>
            <button class="primary-btn" id="review-log-btn" style="margin-top:12px;">Review Full Log</button>
            <div style="font-size:10px;color:var(--dim);margin-top:6px;">A lifetime of stardates, one entry at a time.</div>`;
        } else {
          const rapportRows = Object.entries(crewData).map(([ck,c])=>{
            const rap = (shipState.rapport && shipState.rapport[ck]) || 0;
            const milestoneReached = shipState.milestones && shipState.milestones[ck];
            return { key:ck, name:c.name, rank:rankAbbrev(c.rank), color:c.color, room:c.room, rap, milestoneReached };
          }).sort((a,b)=>b.rap-a.rap);
          const lowest = rapportRows.slice().sort((a,b)=>a.rap-b.rap)[0];
          tabBodyHTML = `
            <div class="rr-rapport-list">
              ${rapportRows.map(r=>`
                <div class="rr-rapport-row">
                  <div class="rr-rapport-name">${r.name} <span style="color:var(--dim);font-size:10px;">${r.rank}</span>${r.milestoneReached ? ' 🤝' : ''}</div>
                  <div class="rr-rapport-bar-wrap"><div class="rr-rapport-bar" style="width:${r.rap}%;background:${r.color};"></div></div>
                  <div class="rr-rapport-val">${r.rap}/100</div>
                </div>
              `).join('')}
            </div>
            ${lowest ? `
              <button class="primary-btn" id="rr-go-lowest" style="margin-top:12px;">Go Talk to ${lowest.name}</button>
              <div style="font-size:10px;color:var(--dim);margin-top:6px;">Lowest rapport right now — a Talk, Favor, or Gift all help.</div>` : ''}`;
        }
        overviewHTML = `
          <div class="quick-launch">
            <div class="cp-heading" style="color:var(--gold);opacity:1;">📖 Captain's Overview</div>
            ${tabsHTML}
            ${tabBodyHTML}
          </div>`;
      } else if(key==='bridge'){
        const cond = shipState.alertCondition || 'green';
        const cfg = alertConfig[cond];
        const standardConds = ['green','yellow','red'];
        const specialConds = ['blue','gray','silent'];
        const condBtnsHTML = (list)=>list.map(c=>`
          <button class="ghost-btn small ${cond===c?'active-alert':''}" data-alert-set="${c}" style="${cond===c ? `border-color:${alertBtnColor(c)};color:${alertBtnColor(c)};` : ''}">${alertConfig[c].label}</button>
        `).join('');
        const alertTabsHTML = `
          <div style="display:flex;gap:6px;margin:10px 0 12px;">
            <button class="filter-pill ${bridgeAlertTab==='standard'?'active':''}" data-ba-tab="standard">General</button>
            <button class="filter-pill ${bridgeAlertTab==='special'?'active':''}" data-ba-tab="special">Special</button>
            <button class="filter-pill ${bridgeAlertTab==='status'?'active':''}" data-ba-tab="status">Status Report</button>
          </div>`;
        let alertBodyHTML = '';
        if(bridgeAlertTab==='standard'){
          alertBodyHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">${condBtnsHTML(standardConds)}</div><p style="font-size:11.5px;color:var(--dim);line-height:1.6;">${cfg.desc}</p>`;
        } else if(bridgeAlertTab==='special'){
          alertBodyHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">${condBtnsHTML(specialConds)}</div><p style="font-size:11.5px;color:var(--dim);line-height:1.6;">${cfg.tier==='special' ? cfg.desc : 'Select a special condition above to see its details.'}</p>`;
        } else {
          const deptLines = alertDeptLines[cond];
          alertBodyHTML = `
            <p style="font-size:11.5px;color:var(--cream);margin-bottom:8px;">${cfg.crew}</p>
            ${deptLines ? deptLines.map(l=>`<p style="font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:4px;">${l}</p>`).join('') : `<p style="font-size:11px;color:var(--dim);">No department-specific reports under ${cfg.label.toLowerCase()}.</p>`}`;
        }
        overviewHTML = `
          <div class="quick-launch">
            <div class="cp-heading" style="color:var(--gold);opacity:1;">🚨 Alert Status — <span style="color:${alertBtnColor(cond)};">${cfg.label}</span></div>
            ${alertTabsHTML}
            ${alertBodyHTML}
          </div>`;
      }
      detailEl.innerHTML = `
        ${missionStageHTML(key)}
        <div class="scene-wrap"><svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">${r.scene}</svg></div>
        <span class="dtag" style="background:${r.color}">${r.tag}</span>
        <h2>${el ? el.querySelector('.rname').textContent : key}</h2>
        <div class="deckname">${r.deck}</div>
        <p>${r.desc}</p>
        <div class="ambient" id="room-ambient">${isHolodeck ? holoPrograms[holoIndex].text : subShip(r.ambient)}</div>
        ${quickLaunchHTML}
        ${overviewHTML}
        ${minigameHTML}
        ${extraHTML}
        ${crewHTML(key)}
        ${suppHTML(key)}
        ${itemHTML(key)}
      `;
      if(key==='ready'){
        const reviewBtn = document.getElementById('review-log-btn');
        if(reviewBtn) reviewBtn.addEventListener('click', ()=>showScreen('log'));
        document.querySelectorAll('[data-rr-tab]').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            readyRoomTab = btn.dataset.rrTab;
            showRoom('ready', document.querySelector('.room[data-room="ready"]'));
          });
        });
        const goLowestBtn = document.getElementById('rr-go-lowest');
        if(goLowestBtn){
          const lowestKey = Object.entries(crewData).map(([ck,c])=>({ck, rap:(shipState.rapport&&shipState.rapport[ck])||0})).sort((a,b)=>a.rap-b.rap)[0].ck;
          goLowestBtn.addEventListener('click', ()=>goToRoom(crewData[lowestKey].room));
        }
      }
      if(key==='bridge'){
        document.querySelectorAll('[data-ba-tab]').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            bridgeAlertTab = btn.dataset.baTab;
            showRoom('bridge', document.querySelector('.room[data-room="bridge"]'));
          });
        });
        document.querySelectorAll('[data-alert-set]').forEach(btn=>{
          btn.addEventListener('click', async ()=>{
            await setAlertCondition(btn.dataset.alertSet);
            showRoom('bridge', document.querySelector('.room[data-room="bridge"]'));
          });
        });
      }
      if(ql){
        ql.items.forEach(it=>{
          document.getElementById('quick-launch-btn-'+it.id).addEventListener('click', it.go);
        });
      }
      const hotBlock = document.getElementById('mission-hot-block');
      if(hotBlock){
        hotBlock.querySelectorAll('[data-stagechoice]').forEach(btn=>{
          btn.addEventListener('click', ()=>advanceSpatialStage(btn.dataset.stagechoice));
        });
        const contBtn = document.getElementById('mission-continue-btn');
        if(contBtn) contBtn.addEventListener('click', ()=>advanceSpatialStage(null));
      }
      if(isHolodeck){
        bindHoloLaunch();
        document.querySelectorAll('#holo-grid [data-holo]').forEach(chip=>{
          chip.addEventListener('click', ()=>{
            holoIndex = parseInt(chip.dataset.holo, 10);
            document.getElementById('room-ambient').textContent = holoPrograms[holoIndex].text;
            document.querySelectorAll('#holo-grid .holo-chip').forEach(c=>c.classList.remove('active'));
            chip.classList.add('active');
            document.getElementById('holo-launch-area').innerHTML = holoLaunchHTML(holoIndex);
            bindHoloLaunch();
          });
        });
      } else if(actions){
        actions.forEach(a=>{
          const cd = key+':'+a.id;
          if(usedToday(cd)) return;
          const btn = document.getElementById('room-action-btn-'+a.id);
          const resultEl = document.getElementById('room-action-result-'+a.id);
          const wasEpisodeTarget = (key+':'+a.id) === getEpisodeTargetAction();
          btn.addEventListener('click', async ()=>{
            if(a.minigame==='stabilize'){
              btn.style.display = 'none';
              runStabilizeMinigame(resultEl, a, cd, btn);
            } else if(a.minigame==='diagnostics'){
              btn.style.display = 'none';
              runDiagnosticsMinigame(resultEl, a, cd, btn);
            } else if(a.minigame==='sync'){
              btn.style.display = 'none';
              runSyncResetMinigame(resultEl, a, cd, btn);
            } else if(a.minigame==='reroute'){
              btn.style.display = 'none';
              runReroutePowerMinigame(resultEl, a, cd, btn);
            } else {
              btn.disabled = true;
              let line = a.lines[Math.floor(Math.random()*a.lines.length)];
              // ---- story beat: Bridge sensor sweep first detects the signal ----
              if(key==='bridge' && a.id==='sensor-sweep' && !(shipState.storyFlags && shipState.storyFlags.signalDetected)){
                if(!shipState.storyFlags) shipState.storyFlags = {};
                shipState.storyFlags.signalDetected = true;
                line += " ...and there's something else — a faint, looping transmission at the edge of sensor range. Not part of the usual traffic. Wren will want to see this.";
              }
              resultEl.textContent = line;
              await grantRoomReward(a.deltas, a.title, line, cd);
              btn.textContent = 'Already done today';
              // if this was the episode's targeted action, let the player read at their own pace,
              // then explicitly continue when ready - no auto-timer, no text vanishing mid-read.
              if(wasEpisodeTarget){
                const contBtn = document.createElement('button');
                contBtn.className = 'primary-btn';
                contBtn.style.marginTop = '10px';
                contBtn.textContent = 'Continue';
                contBtn.addEventListener('click', ()=>renderDeck(key));
                resultEl.parentElement.appendChild(contBtn);
              }
            }
          });
        });
      }
      if(supplementaryCrew[key]){
        document.getElementById('supp-say-hi-'+key).addEventListener('click', ()=>{
          const s = supplementaryCrew[key];
          const pl = pickLines(s);
          const line = pl[Math.floor(Math.random()*pl.length)];
          document.getElementById('supp-result-'+key).textContent = line;
        });
      }
      if(itemData[key]){
        document.getElementById('item-examine-'+key).addEventListener('click', async ()=>{
          const lines = getItemLines(key);
          const line = lines[Math.floor(Math.random()*lines.length)];
          document.getElementById('item-result-'+key).textContent = line;
          if(!shipState.keepsakes) shipState.keepsakes = {};
          if(!shipState.keepsakes[key]){
            shipState.keepsakes[key] = true;
            await saveShipState();
            const infoEl = document.getElementById('item-info-'+key);
            if(infoEl && !infoEl.querySelector('.cp-collected')){
              infoEl.innerHTML += ' <span class="cp-collected">★ Collected</span>';
            }
          }
        });
      }
      bindCrewButtons();
    }
    document.querySelectorAll('.room').forEach(el=>{
      el.addEventListener('click', ()=>showRoom(el.dataset.room, el));
    });
    bindSpatialBanner();
    bindEpisodeStrip();
    const dismissBtn = document.getElementById('dismiss-summary');
    if(dismissBtn) dismissBtn.addEventListener('click', ()=>{ completedSpatialSummary = null; renderDeck(); });
    const nextChapterBtn = document.getElementById('summary-next-chapter');
    if(nextChapterBtn && completedSpatialSummary && completedSpatialSummary.nextChapterGo){
      const goFn = completedSpatialSummary.nextChapterGo;
      nextChapterBtn.addEventListener('click', ()=>{
        completedSpatialSummary = null;
        goFn();
      });
    }
    const startRoom = initialRoom || 'bridge';
    showRoom(startRoom, document.querySelector(`.room[data-room="${startRoom}"]`));
  }

  function mStepComplete(){
    const straitsLine = mstate.route==='straits'
      ? (mstate.straits==='hold'
          ? "You pushed straight through the Straits. One jar of preserves didn't survive the crossing — the rest arrived intact, if a little shaken."
          : "You throttled down and drifted through the turbulence. It cost twenty extra minutes, but every jar arrived without a scratch.")
      : (mstate.straits==='watch'
          ? "You slowed the ship to watch the void-whales pass. The whole crew came up to the observation lounge for it — worth every minute lost."
          : "You got a photo of the void-whales on the way past. Someone's already asked to print it for the mess hall wall.");
    const arrivalLine = mstate.arrival==='mail'
      ? "Juno read the letter right there at the airlock, cargo forgotten for a minute. Whoever it was from, it was worth the wait."
      : "You unloaded the crate first — Juno tore straight into the jam before the mail, laughing about priorities the whole time.";

    // ---- compute stat deltas from the choices made this run ----
    const routeDeltas = {
      'straits|hold':  {hull:-2, morale:-1},
      'straits|drift': {power:-2, morale:1},
      'scenic|watch':  {morale:4, power:-1},
      'scenic|photo':  {morale:2}
    };
    const arrivalDeltas = { mail:{morale:2}, cargo:{morale:1} };
    const rKey = mstate.route + '|' + mstate.straits;
    const rd = routeDeltas[rKey] || {};
    const ad = arrivalDeltas[mstate.arrival] || {};
    const totals = {
      hull: (rd.hull||0) + (ad.hull||0),
      power: (rd.power||0) + (ad.power||0),
      morale: (rd.morale||0) + (ad.morale||0)
    };

    shipState.hull = clamp(shipState.hull + totals.hull);
    shipState.power = clamp(shipState.power + totals.power);
    shipState.morale = clamp(shipState.morale + totals.morale);
    shipState.completed.cargo += 1;
    shipState.log.unshift({
      t: Date.now(), title:'Preserves for Outpost 7',
      lines:[straitsLine, arrivalLine], totals
    });
    saveShipState();

    function rewardChip(label, val){
      if(!val) return '';
      const cls = val>0 ? 'reward' : 'reward neg';
      const sign = val>0 ? '+' : '';
      return `<span class="${cls}">${label} ${sign}${val}</span>`;
    }
    const rewardChips = [
      rewardChip('Morale', totals.morale),
      rewardChip('Power', totals.power),
      rewardChip('Hull', totals.hull),
      '<span class="reward">Juno owes you a favor</span>',
      '<span class="reward">Manifest: cleared</span>'
    ].join('');

    mRender(`

        <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="320" height="200" fill="#050409"/>

          <circle cx="40" cy="30" r="1.4" fill="#fff"/><circle cx="280" cy="50" r="1.6" fill="#fff"/>
          <circle cx="90" cy="170" r="1.2" fill="#fff"/><circle cx="240" cy="160" r="1.3" fill="#fff"/>
        </svg>
        <div class="vs-label">Delivery complete</div>
      </div>
      <span class="m-tag">Mission Complete</span>
      <h2>Outpost 7, delivered</h2>
      <div class="logbox">
        <div class="lline"><b>Holo-Log —</b> ${straitsLine}</div>
        <div class="lline">${arrivalLine}</div>
      </div>
      <div class="rewards">${rewardChips}</div>
      <p>The ${shipName.charAt(0)+shipName.slice(1).toLowerCase()} is empty-holded and ready for whatever's next.</p>
      <button class="ghost-btn" id="again-btn">Fly this run again</button>
      <button class="primary-btn" id="return-btn">Return to Bridge</button>
    `, ()=>{
      document.getElementById('again-btn').addEventListener('click', ()=>{
        mstate.route=null; mstate.straits=null; mstate.arrival=null;
        mStepBriefing();
      });
      document.getElementById('return-btn').addEventListener('click', exitMission);
    });
  }

      ${setMProgress(3)}
      <div class="viewscreen" style="margin-bottom:16px">${dipRoomSVG()}<div class="vs-label">Conference Room — closing</div></div>

  function dipStepComplete(){
    const line1 = {
      'vent|address': "You let both delegations air their grievances fully, including the old fishing dispute — it took longer, but nothing was left to fester.",
      'vent|table': "You let both sides vent, then gently tabled the old fishing grievance for a future session. The room stayed calm, if not fully satisfied.",
      'agenda|teabreak': "The strict agenda ruffled feathers fast, but a well-timed tea break cooled things down before they boiled over.",
      'agenda|pushthrough': "You kept strictly to the agenda and pushed through the tension. The talks finished on time, but a little frostier than they started."
    }[dipState.open + '|' + dipState.event];
    const line2 = dipState.resolution==='split'
      ? "In the end, you split the tariff difference down the middle. Neither side got everything, but both signed."
      : "You leaned toward whichever side had already conceded more. The deal is signed — one delegation looks considerably happier than the other.";

    const openDeltas = { vent:{morale:1}, agenda:{morale:-1} };
    const eventDeltas = { address:{morale:2}, table:{morale:-1}, teabreak:{morale:2, power:-1}, pushthrough:{morale:-2} };
    const resolutionDeltas = { split:{morale:3}, favor:{morale:-1} };
    const od = openDeltas[dipState.open] || {};
    const ed = eventDeltas[dipState.event] || {};
    const rd = resolutionDeltas[dipState.resolution] || {};
    const totals = {
      hull: (od.hull||0)+(ed.hull||0)+(rd.hull||0),
      power: (od.power||0)+(ed.power||0)+(rd.power||0),

        // runStabilizeMinigame is built for its normal persistent-room context, where it
        // re-shows the trigger button as "Already done today" after its own internal save
        // completes. A setInterval poll checking usedToday() raced against that - the flag

      <div id="wc3-reset-container"></div>
    `, ()=>{
      const container = document.getElementById('wc3-reset-container');
      container.innerHTML = `
        <div style="font-size:11px;color:var(--dim);margin:6px 0 10px;">Watch the two indicators. Lock the sync the instant they align.</div>
        <div style="position:relative;height:60px;background:rgba(0,0,0,0.25);border-radius:8px;overflow:hidden;margin-bottom:12px;">
          <div id="wc3-core-dot" style="position:absolute;top:10px;width:14px;height:14px;border-radius:50%;background:var(--gold);"></div>
          <div id="wc3-power-dot" style="position:absolute;top:34px;width:14px;height:14px;border-radius:50%;background:var(--peri);"></div>
        </div>
        <button class="primary-btn" id="wc3-lock-btn">LOCK SYNC</button>
        <div id="wc3-reset-result" style="margin-top:8px;font-size:11px;color:var(--gold);min-height:14px;"></div>
      `;
      const coreDot = document.getElementById('wc3-core-dot');
      const powerDot = document.getElementById('wc3-power-dot');
      const trackWidth = 280;
      let t = 0, running = true;
      function frame(){
        if(!running) return;
        t += 1;
        const corePos = (Math.sin(t*0.045)+1)/2 * trackWidth;
        const powerPos = (Math.sin(t*0.031)+1)/2 * trackWidth;
        coreDot.style.left = corePos + 'px';
        powerDot.style.left = powerPos + 'px';
        coreDot.dataset.pos = corePos;
        powerDot.dataset.pos = powerPos;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      document.getElementById('wc3-lock-btn').addEventListener('click', ()=>{
        const corePos = parseFloat(coreDot.dataset.pos||0);
        const powerPos = parseFloat(powerDot.dataset.pos||0);
        const diff = Math.abs(corePos-powerPos);
        const resultEl = document.getElementById('wc3-reset-result');
        if(diff < 18){

          resultEl.textContent = "Lock confirmed. The core and the routing settle into sync, together, for the first time since the overload.";

      });

  function driftCh4StepDecode(){
    const fragments = [
      { key:'a', pct:12, label:'Fragment — Signal Integrity: 12%', route:'A faint starfield resolves, nothing more.' },
      { key:'b', pct:34, label:'Fragment — Signal Integrity: 34%', route:'Waypoint I' },
      { key:'c', pct:58, label:'Fragment — Signal Integrity: 58%', route:'Waypoint II' },
      { key:'d', pct:76, label:'Fragment — Signal Integrity: 76%', route:'Waypoint III' },
      { key:'e', pct:91, label:'Fragment — Signal Integrity: 91%', route:'The final point.' }
    ];
    const order = ['a','b','c','d','e'];
    let nextIndex = 0;
    mRender(`
      ${setMProgress(0,9)}
      <div class="viewscreen" style="margin-bottom:16px">${LASTLIGHT_SCENE_SVG}<div class="vs-label">Aboard the Lastlight — navigation display</div></div>
      <span class="m-tag" style="background:var(--gold)">Wren (Science Officer)</span>
      <h2>Reconstructing the Sequence</h2>
      <p>Wren (Science Officer) isolates five distinct fragments buried under the beacon's basic signal. "Click them in order — most degraded to least. The oldest piece will have decayed the most just from broadcasting the longest. That should give us the actual sequence."</p>
      <div id="dc4-fragments" style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;"></div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:6px;">Route reconstructed so far:</div>
      <div id="dc4-route-display" style="min-height:26px;font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:12px;"></div>
      <button class="primary-btn" id="dc4-continue" style="margin-top:14px;display:none;">Continue</button>
    `, ()=>{
      const container = document.getElementById('dc4-fragments');
      const shuffled = [...fragments].sort(()=>Math.random()-0.5);
      shuffled.forEach(f=>{
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.style.flex = '1';
        btn.style.minWidth = '160px';
        btn.textContent = f.label;
        btn.id = 'dc4-frag-'+f.key;
        btn.addEventListener('click', ()=>{
          const expected = order[nextIndex];
          if(f.key === expected){
            btn.disabled = true;
            btn.style.opacity = '0.4';
            nextIndex++;
            const routeSoFar = order.slice(0, nextIndex).map(k=>fragments.find(x=>x.key===k).route).join(' → ');
            document.getElementById('dc4-route-display').textContent = routeSoFar;
            if(nextIndex === order.length){
              document.getElementById('dc4-continue').style.display = 'inline-block';
            }
          } else {
            btn.style.borderColor = 'var(--rose)';
            setTimeout(()=>{ btn.style.borderColor = ''; }, 500);
          }
        });
        container.appendChild(btn);
      });
      document.getElementById('dc4-continue').addEventListener('click', driftCh4StepWaypoints);
    });
  }

  let flightRAF = null;
  let flightKeyHandlers = null;

  function stopFlightLoop(){
    if(flightRAF){ cancelAnimationFrame(flightRAF); flightRAF = null; }
    if(flightKeyHandlers){
      window.removeEventListener('keydown', flightKeyHandlers.down);
      window.removeEventListener('keyup', flightKeyHandlers.up);
      flightKeyHandlers = null;
    }

  function renderFlightDeck(){

  function startFlight(craftKey, objKey, destKey){

    setActivePill(null);
    const c = crafts[craftKey];
    const o = objectives[objKey];
    const destName = destKey ? destinationsData[destKey].name : null;
    hdrRight.textContent = (craftKey==='starship' ? 'STARSHIP' : 'SHUTTLE') + ' — ' + o.label.toUpperCase() + (destName ? ' — ' + destName.toUpperCase() : '');

    const objStatusInit = objKey==='prospect' ? 'Carrying: 0 glimmerite'
      : objKey==='cargo' ? 'Cargo: empty'
      : objKey==='escort' ? 'Escorted: 0/3'
      : objKey==='anomaly' ? 'Scanned: 0/4'
      : objKey==='reflock' ? `Locked: ${flagIsSet('foldProbedAggressive') ? 1 : 0}/${(typeof foldReflockTarget !== 'undefined' && foldReflockTarget) ? foldReflockTarget : 4}`
      : objKey==='courier' ? (((typeof voscourierPendingFlight !== 'undefined' && voscourierPendingFlight) || (typeof homeCh4PendingDocking !== 'undefined' && homeCh4PendingDocking)) ? 'Dignitary: aboard (bumps: 0)' : 'Dignitary: not aboard')

      : objKey==='evac' ? 'Pod: adrift'

      : objKey==='intercept' ? 'Hostile shields: 3/3'

        <div class="ctrl-btn" id="ctrl-left">◀</div>

        ${(objKey==='debris'||objKey==='intercept') ? '<div class="ctrl-btn fire" id="ctrl-fire">FIRE</div>' : ''}
        ${objKey==='evac' ? '<div class="ctrl-btn tractor" id="ctrl-fire">TRACTOR</div>' : ''}
      </div>
      ${holoOrigin ? '' : `

        <button class="ghost-btn" id="flight-switch">Change Craft</button>
        <button class="primary-btn" id="flight-return">Return to Bridge</button>
      </div>`}
    `;
    bindHoloBanner();

    if(!holoOrigin){
      document.getElementById('flight-obj-switch').addEventListener('click', ()=>{

      document.getElementById('flight-return').addEventListener('click', ()=>{

    runFlightSim(c, craftKey, objKey, destKey);
