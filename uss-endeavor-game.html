<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USS Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0F0E17; --panel:#17151F; --panel-deep:#000000;
    --amber:#E8A64D; --rose:#D98B92; --peri:#8C9EDB; --sage:#9CB88F; --gold:#F2C879;
    --cream:#F2ECDD; --dim:#78748A; --hairline:#2A2733;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--cream);font-family:'IBM Plex Mono',monospace;overflow-x:hidden;}
  .label{font-family:'Antonio',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}

  /* ---------- onboarding ---------- */
  #onboard{position:fixed;inset:0;background:var(--void);display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .5s ease;}
  #onboard.hidden{opacity:0;pointer-events:none;}
  .onboard-card{background:var(--panel);border:1px solid var(--hairline);border-radius:18px;padding:36px 40px;max-width:420px;width:90%;box-shadow:0 0 0 6px var(--amber) inset;}
  .onboard-card .label{font-size:26px;color:var(--amber);margin-bottom:4px;}
  .onboard-card p{color:var(--dim);font-size:12.5px;line-height:1.5;margin:0 0 20px;}
  .onboard-card input{width:100%;background:var(--panel-deep);border:1px solid var(--hairline);color:var(--cream);font-family:'IBM Plex Mono',monospace;font-size:14px;padding:11px 13px;border-radius:9px;margin-bottom:12px;}
  .onboard-card input:focus{outline:none;border-color:var(--amber);}
  .onboard-card button{width:100%;background:var(--amber);color:var(--panel-deep);border:none;border-radius:9px;font-family:'Antonio',sans-serif;font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:12px;cursor:pointer;margin-top:6px;transition:background .15s;}
  .onboard-card button:hover{background:var(--gold);}

  /* ---------- shell ---------- */
  #shell{max-width:1180px;margin:0 auto;padding:18px 18px 60px;opacity:0;transition:opacity .6s ease;}
  #shell.ready{opacity:1;}

  .header-row{display:flex;align-items:stretch;gap:6px;margin-bottom:6px;}
  .elbow{width:120px;height:64px;background:var(--amber);border-radius:0 0 0 34px;flex-shrink:0;position:relative;}
  .elbow::after{content:"";position:absolute;top:0;right:0;width:34px;height:34px;background:var(--void);}
  .header-bar{flex:1;background:var(--amber);border-radius:0 20px 20px 0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
  .header-bar .shipname{font-family:'Antonio',sans-serif;font-size:22px;font-weight:700;color:var(--panel-deep);letter-spacing:.03em;}
  .header-bar .hb-right{font-size:11.5px;color:var(--panel-deep);font-weight:500;letter-spacing:.02em;}
  .hdr-alert{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.06em;font-weight:700;transition:all .3s;}
  .hdr-alert:empty{display:none;}
  .hdr-alert.alert-yellow{background:var(--panel-deep);color:#F2C879;padding:4px 12px;border-radius:10px;}
  .hdr-alert.alert-red{background:#C6303E;color:#fff;padding:4px 12px;border-radius:10px;animation:hdr-pulse 1.4s infinite;}
  .hdr-alert.alert-blue{background:var(--panel-deep);color:#8FA8D9;padding:4px 12px;border-radius:10px;}
  .hdr-alert.alert-gray{background:rgba(0,0,0,0.18);color:var(--panel-deep);padding:4px 12px;border-radius:10px;opacity:.75;}
  .hdr-alert.alert-silent{background:transparent;color:var(--panel-deep);opacity:.55;font-style:italic;font-weight:500;}
  @keyframes hdr-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .header-sub{display:flex;gap:6px;margin-bottom:16px;}
  .header-sub div{height:10px;border-radius:6px;}
  .hs1{width:120px;background:var(--rose);} .hs2{flex:1;background:var(--peri);} .hs3{width:60px;background:var(--sage);}

  /* nav */
  .grid{display:grid;grid-template-columns:150px 1fr;gap:8px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;} .nav{flex-direction:row;flex-wrap:wrap;} .nav-pill{flex:1 1 45%;}}
  .nav{display:flex;flex-direction:column;gap:6px;}
  .nav-pill{background:var(--panel);border:1px solid var(--hairline);color:var(--dim);font-family:'Antonio',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:14px;padding:13px 16px;border-radius:16px 4px 4px 16px;cursor:pointer;transition:.15s;text-align:left;}
  .nav-pill:hover{color:var(--cream);border-color:var(--peri);}
  .nav-pill.active{background:var(--peri);color:var(--panel-deep);border-color:var(--peri);}
  .nav-pill .k{display:block;font-size:9px;opacity:.65;font-weight:400;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;text-transform:none;margin-top:2px;}
  .grid.no-nav{grid-template-columns:1fr;}

  .main{display:flex;flex-direction:column;gap:10px;}
  .missions-sticky-header{display:flex;flex-direction:column;gap:10px;}
  .missions-scroll-area{max-height:62vh;overflow-y:auto;padding-right:6px;margin-right:-6px;}
  .missions-scroll-area::-webkit-scrollbar{width:6px;}
  .missions-scroll-area::-webkit-scrollbar-track{background:transparent;}
  .missions-scroll-area::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:3px;}
  @media(max-width:760px){.missions-scroll-area{max-height:none;overflow-y:visible;}}
  .mission-filter-bar{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--hairline);}
  .filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .filter-label{font-family:'Antonio',sans-serif;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-right:2px;}
  .filter-pill{background:var(--panel-deep);border:1px solid var(--hairline);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 11px;border-radius:12px;cursor:pointer;transition:all .15s;}
  .filter-pill:hover{border-color:var(--gold);color:var(--cream);}
  .filter-pill.active{background:var(--gold);border-color:var(--gold);color:var(--panel-deep);font-weight:600;}
  .rr-rapport-list{display:flex;flex-direction:column;gap:10px;}
  .rr-rapport-row{display:flex;align-items:center;gap:10px;}
  .rr-rapport-name{flex:0 0 130px;font-size:11.5px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rr-rapport-bar-wrap{flex:1;height:8px;background:var(--panel-deep);border-radius:4px;overflow:hidden;border:1px solid var(--hairline);}
  .rr-rapport-bar{height:100%;border-radius:4px;transition:width .3s ease;}
  .rr-rapport-val{flex:0 0 48px;font-size:10.5px;color:var(--dim);text-align:right;}
  @media(max-width:520px){.rr-rapport-name{flex-basis:100px;}}

  /* viewscreen (bridge + mission) */
  .viewscreen{background:var(--panel-deep);border-radius:16px;border:1px solid var(--hairline);height:200px;position:relative;overflow:hidden;}
  .viewscreen canvas, .viewscreen svg{display:block;width:100%;height:100%;}
  .viewscreen .vs-label{position:absolute;bottom:10px;left:14px;font-size:10.5px;color:var(--amber);letter-spacing:.08em;font-family:'Antonio',sans-serif;text-transform:uppercase;}

  /* status meters */
  .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .meter{background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:12px 14px;}
  .meter .m-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .meter .m-name{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);}
  .meter .m-val{font-size:15px;font-weight:600;}
  .segs{display:flex;gap:3px;}
  .segs div{height:9px;flex:1;border-radius:2px;background:var(--hairline);}
  .m-hull .segs div.on{background:var(--sage);}
  .m-power .segs div.on{background:var(--amber);}
  .m-morale .segs div.on{background:var(--rose);}

  /* cozy strip */
  .cozy-strip{background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:11px 16px;display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--dim);}
  .cozy-strip b{color:var(--gold);font-weight:600;}
  .cozy-strip .dot{color:var(--hairline);}

  /* mission board */
  .board-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px;}
  .board-head .label{font-size:16px;color:var(--cream);}
  .board-head span{font-size:10.5px;color:var(--dim);}
  .missions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:760px){.missions{grid-template-columns:1fr;}}
  .m-card{background:var(--panel);border:1px solid var(--hairline);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
  .m-card:hover{border-color:var(--tag-color,var(--amber));transform:translateY(-2px);}
  .m-card .tag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:10px;color:var(--panel-deep);font-weight:700;}
  .m-card h3{font-family:'Antonio',sans-serif;font-size:17px;margin:0 0 6px;font-weight:600;letter-spacing:.01em;}
  .m-card p{font-size:11.5px;color:var(--dim);margin:0 0 12px;line-height:1.5;}
  .m-card .meta{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;border-top:1px solid var(--hairline);padding-top:9px;}
  .m-card .playable{position:absolute;top:12px;right:12px;font-size:9px;color:var(--sage);letter-spacing:.05em;text-transform:uppercase;font-family:'Antonio',sans-serif;}

  /* placeholder */
  .placeholder{background:var(--panel);border:1px dashed var(--hairline);border-radius:14px;padding:40px 20px;text-align:center;color:var(--dim);font-size:12px;}
  .placeholder .label{font-size:18px;color:var(--peri);margin-bottom:8px;}

  /* deck plan */
  .legend{display:flex;gap:18px;margin-bottom:4px;flex-wrap:wrap;}
  .legend span{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:7px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .deck-layout{display:flex;flex-direction:column;gap:14px;}
  .deck-row{display:grid;grid-template-columns:100px repeat(3,1fr);gap:8px;margin-bottom:8px;}
  @media(max-width:560px){.deck-row{grid-template-columns:1fr;} .deck-tag{border-radius:12px 12px 0 0 !important;}}
  .deck-tag{border-radius:14px 4px 4px 14px;display:flex;flex-direction:column;justify-content:center;padding:10px 12px;color:var(--panel-deep);}
  .deck-tag .dl{font-family:'Antonio',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .deck-tag .dn{font-size:9px;opacity:.75;}
  .room{background:var(--panel);border:2px solid var(--hairline);border-radius:10px;padding:12px;cursor:pointer;transition:.15s;position:relative;min-height:70px;display:flex;flex-direction:column;justify-content:flex-end;}
  .room:hover{border-color:var(--room-color,var(--gold));}
  .room.active{border-color:var(--room-color,var(--gold));background:#1D1A28;}
  .room .rname{font-family:'Antonio',sans-serif;font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;}
  .room .rocc{font-size:9.5px;color:var(--dim);margin-top:3px;}
  .room .paw{position:absolute;top:8px;right:10px;font-size:13px;opacity:.85;}
  .detail{background:var(--panel);border:1px solid var(--hairline);border-radius:16px;padding:18px;}
  .detail .scene-wrap{background:var(--panel-deep);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .detail .scene-wrap svg{display:block;width:100%;height:auto;}
  .detail .dtag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;color:var(--panel-deep);font-weight:700;}
  .detail h2{font-family:'Antonio',sans-serif;font-size:22px;margin:0 0 4px;font-weight:700;}
  .detail .deckname{font-size:10.5px;color:var(--dim);margin-bottom:14px;letter-spacing:.03em;}
  .detail p{font-size:12.5px;line-height:1.6;color:var(--cream);margin:0 0 14px;}
  .detail .ambient{font-size:11.5px;color:var(--gold);background:var(--panel-deep);border-radius:8px;padding:10px 12px;border:1px solid var(--hairline);line-height:1.5;}
  .crew-present{margin-top:14px;border-top:1px solid var(--hairline);padding-top:12px;}
  .cp-heading{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
  .cp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;}
  .cp-info{font-size:12px;color:var(--cream);}
  .cp-rapport{font-size:10px;color:var(--dim);margin-top:2px;}
  .cp-result{font-size:11px;color:var(--gold);margin-bottom:4px;min-height:14px;}
  .cp-milestone{font-size:10.5px;color:var(--gold);background:rgba(242,200,121,0.1);border:1px solid var(--gold);border-radius:8px;padding:6px 10px;margin-top:6px;}
  .cp-collected{color:var(--gold);font-size:10px;font-family:'Antonio',sans-serif;letter-spacing:.03em;text-transform:uppercase;}

  /* spatial mission banner + in-room hot interaction */
  .mission-banner{
    background:var(--panel);border:1px solid var(--sage);border-radius:14px;padding:14px 18px;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .mission-banner-complete{align-items:flex-start;}
  .mission-banner .mb-left{display:flex;align-items:center;gap:10px;font-size:13px;}
  .mission-banner .mb-left .tag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;color:var(--panel-deep);font-weight:700;}
  .mission-banner .mb-obj{font-size:11.5px;color:var(--dim);}
  .mission-banner .mb-summary{font-size:11.5px;color:var(--cream);line-height:1.6;margin-top:6px;max-width:520px;}
  .mb-step{font-size:10px;color:var(--dim);background:var(--panel-deep);border:1px solid var(--hairline);border-radius:10px;padding:2px 8px;}
  .room.mission-active{border-color:var(--gold) !important;box-shadow:0 0 0 2px rgba(242,200,121,0.25);position:relative;}
  .room.mission-active::after{
    content:'MISSION';position:absolute;top:6px;right:6px;font-family:'Antonio',sans-serif;font-size:8px;letter-spacing:.05em;
    color:var(--panel-deep);background:var(--gold);padding:2px 5px;border-radius:6px;font-weight:700;
  }
  .m-card.mission-active, .craft-card.mission-active{border-color:var(--gold) !important;box-shadow:0 0 0 2px rgba(242,200,121,0.25);}
  .mission-hot{
    background:rgba(156,184,143,0.08);border:1px solid var(--sage);border-radius:14px;padding:16px;margin-bottom:16px;
  }
  .mission-hot .mh-tag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;color:var(--panel-deep);font-weight:700;margin-bottom:10px;}
  .mission-hot .mh-prompt{font-size:12.5px;color:var(--cream);line-height:1.55;margin:0 0 12px;}
  .ghost-btn.small{padding:7px 12px;font-size:10.5px;margin-right:0;flex-shrink:0;}
  .primary-btn.small{padding:7px 12px;font-size:10.5px;margin-right:0;flex-shrink:0;}
  .supp-crew{margin-top:12px;border-top:1px dashed var(--hairline);padding-top:10px;}
  .quick-launch{margin-top:14px;margin-bottom:4px;background:rgba(242,200,121,0.06);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;}

  /* episode panel */
  .episode-panel{background:rgba(242,200,121,0.05);border:1px solid var(--gold);border-radius:16px;padding:18px;margin-bottom:18px;}
  .ep-header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .ep-badge{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.08em;color:var(--gold);background:rgba(242,200,121,0.12);border:1px solid var(--gold);border-radius:20px;padding:3px 10px;}
  .episode-panel h3{margin:0;font-family:'Antonio',sans-serif;font-size:20px;}
  .ep-blurb{font-size:12px;color:var(--dim);line-height:1.5;margin:0 0 14px;}
  .ep-chapters{display:flex;flex-direction:column;gap:8px;}
  .ep-chapter{display:flex;align-items:center;gap:12px;background:var(--panel-deep);border:1px solid var(--hairline);border-radius:10px;padding:10px 12px;}
  .ep-chapter.locked{opacity:0.45;}
  .ep-chapter.done{opacity:0.75;}
  .ep-num{font-family:'Antonio',sans-serif;font-size:16px;color:var(--gold);width:22px;text-align:center;flex-shrink:0;}
  .ep-info{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ep-info b{font-size:12.5px;}
  .ep-status{font-size:10.5px;color:var(--dim);}
  .ep-chapter.active .ep-status{color:var(--gold);}
  .ep-destinations{display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0;}
  @media(max-width:520px){.ep-destinations{width:100%;}}
  @media(max-width:520px){.ep-chapter{flex-wrap:wrap;} .ep-chapter button{width:100%;}}

  /* stabilize-the-core minigame */
  .stabilize-track{position:relative;height:16px;background:var(--panel-deep);border:1px solid var(--hairline);border-radius:8px;overflow:hidden;}
  .stabilize-zone{position:absolute;top:0;bottom:0;left:40%;width:20%;background:rgba(156,184,143,0.35);border-left:1px solid var(--sage);border-right:1px solid var(--sage);}
  .stabilize-indicator{position:absolute;top:-2px;bottom:-2px;width:5px;background:var(--gold);border-radius:2px;transition:left 0.03s linear;}

  /* diagnostics minigame */
  .diag-panel{position:relative;height:120px;background:var(--panel-deep);border:1px solid var(--hairline);border-radius:10px;overflow:hidden;}
  .diag-blip{
    position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(217,139,146,0.5);
    border:2px solid var(--rose);cursor:pointer;animation:diagPulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes diagPulse{ from{transform:scale(0.9);opacity:0.7;} to{transform:scale(1.1);opacity:1;} }

  /* transporter calibration minigame */
  .dial-row{margin-top:10px;}
  .dial-label{font-size:10.5px;color:var(--dim);display:block;margin-bottom:4px;}
  .dial-slider{width:100%;accent-color:var(--gold);}
  .dial-track{position:relative;height:6px;background:var(--panel-deep);border-radius:3px;margin-top:2px;}
  .dial-zone{position:absolute;top:0;bottom:0;left:40%;width:20%;background:rgba(156,184,143,0.4);border-radius:3px;}

  /* mission play */
  .scene{background:var(--panel);border:1px solid var(--hairline);border-radius:16px;overflow:hidden;}
  .scene-body{padding:22px 24px 24px;}
  .scene-body h2{font-family:'Antonio',sans-serif;font-size:22px;margin:0 0 12px;font-weight:700;}
  .scene-body p{font-size:13px;line-height:1.65;color:var(--cream);margin:0 0 12px;}
  .manifest{background:var(--panel-deep);border:1px solid var(--hairline);border-radius:10px;padding:12px 14px;font-size:11.5px;color:var(--dim);margin-bottom:18px;line-height:1.7;}
  .manifest b{color:var(--gold);}
  .m-tag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:12px;color:var(--panel-deep);font-weight:700;background:var(--amber);}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .choice-btn{background:var(--panel-deep);border:1px solid var(--hairline);color:var(--cream);text-align:left;padding:14px 16px;border-radius:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12.5px;transition:.15s;line-height:1.5;width:100%;}
  .choice-btn:hover{border-color:var(--amber);background:#1D1A28;}
  .choice-btn .cb-title{font-family:'Antonio',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--amber);display:block;margin-bottom:3px;}
  .primary-btn{background:var(--amber);color:var(--panel-deep);border:none;border-radius:10px;font-family:'Antonio',sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:13px 22px;cursor:pointer;transition:.15s;}
  .primary-btn:hover{background:var(--gold);}
  .ghost-btn{background:transparent;border:1px solid var(--hairline);color:var(--dim);border-radius:10px;font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:11px 18px;cursor:pointer;margin-right:10px;}
  .ghost-btn:hover{color:var(--cream);border-color:var(--peri);}
  .ghost-btn:disabled{opacity:0.45;cursor:default;color:var(--dim);border-color:var(--hairline);}
  .logbox{background:var(--panel-deep);border:1px solid var(--hairline);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
  .logbox .lline{font-size:12px;color:var(--cream);line-height:1.7;margin-bottom:6px;}
  .logbox .lline b{color:var(--gold);}
  .rewards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .reward{background:var(--panel-deep);border:1px solid var(--sage);color:var(--sage);border-radius:20px;padding:6px 14px;font-size:11px;font-family:'Antonio',sans-serif;letter-spacing:.03em;text-transform:uppercase;}
  .reward.neg{border-color:var(--rose);color:var(--rose);}
  .progress{display:flex;gap:6px;margin-bottom:14px;}
  .progress div{flex:1;height:5px;border-radius:3px;background:var(--hairline);transition:.3s;}
  .progress div.on{background:var(--amber);}

  /* flight deck */
  .craft-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.craft-cards{grid-template-columns:1fr;}}
  .craft-card{background:var(--panel);border:1px solid var(--hairline);border-radius:16px;padding:20px;cursor:pointer;transition:.15s;}
  .craft-card:hover{border-color:var(--craft-color,var(--amber));transform:translateY(-2px);}
  .craft-card-locked{opacity:0.45;cursor:default;}
  .craft-card-locked:hover{border-color:var(--hairline);transform:none;}
  .craft-card .tag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;color:var(--panel-deep);font-weight:700;}
  .craft-card h3{font-family:'Antonio',sans-serif;font-size:19px;margin:0 0 8px;font-weight:700;}
  .craft-card p{font-size:12px;color:var(--dim);line-height:1.6;margin:0;}
  .flight-canvas-wrap{background:#000;border-radius:16px;border:1px solid var(--hairline);overflow:hidden;position:relative;}
  .flight-canvas-wrap canvas{display:block;width:100%;aspect-ratio:2/1;touch-action:none;}
  .hud-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:11px;color:var(--dim);flex-wrap:wrap;gap:8px;}
  .hud-row b{color:var(--gold);}
  .controls-row{display:flex;justify-content:center;gap:14px;margin:8px 0 16px;}
  .ctrl-btn{
    width:64px;height:64px;border-radius:16px;background:var(--panel);border:1px solid var(--hairline);
    color:var(--cream);font-family:'Antonio',sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:.1s;
  }
  .ctrl-btn:active, .ctrl-btn.pressed{background:var(--amber);color:var(--panel-deep);border-color:var(--amber);}
  .ctrl-btn.thrust{width:84px;font-size:22px;}
  .ctrl-btn.fire{border-color:var(--rose);color:var(--rose);font-size:14px;letter-spacing:.04em;}
  .ctrl-btn.fire:active, .ctrl-btn.fire.pressed{background:var(--rose);color:var(--panel-deep);border-color:var(--rose);}
  .ctrl-btn.tractor{border-color:var(--peri);color:var(--peri);font-size:12px;letter-spacing:.03em;}
  .ctrl-btn.tractor:active, .ctrl-btn.tractor.pressed{background:var(--peri);color:var(--panel-deep);border-color:var(--peri);}

  /* holodeck program selector */
  .holo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  @media(max-width:480px){.holo-grid{grid-template-columns:1fr;}}
  .holo-chip{
    background:var(--panel-deep);border:1px solid var(--hairline);color:var(--cream);border-radius:10px;
    padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:left;cursor:pointer;
    transition:.15s;display:flex;align-items:center;gap:9px;
  }
  .holo-chip:hover{border-color:var(--peri);}
  .holo-chip.active{border-color:var(--gold);background:rgba(242,200,121,0.08);color:var(--gold);}
  .holo-chip .hc-icon{font-size:15px;flex-shrink:0;}
  .flight-toast{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);
    color:var(--gold);padding:8px 18px;border-radius:20px;font-family:'Antonio',sans-serif;font-size:12px;
    letter-spacing:.04em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .flight-toast.show{opacity:1;}

  /* modal */
  #modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:20px;}
  #modal-overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:16px;max-width:440px;width:100%;padding:26px;border:1px solid var(--hairline);}
  .modal .tag{display:inline-block;font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:12px;color:var(--panel-deep);font-weight:700;}
  .modal h3{font-family:'Antonio',sans-serif;font-size:20px;margin:0 0 10px;}
  .modal p{font-size:12.5px;color:var(--cream);line-height:1.6;margin:0 0 18px;}
  .modal .closebtn{background:transparent;border:1px solid var(--hairline);color:var(--dim);border-radius:9px;padding:9px 16px;font-family:'Antonio',sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-size:12px;}
  .modal .closebtn:hover{color:var(--cream);border-color:var(--peri);}
</style>
</head>
<body>

<div id="onboard">
  <div class="onboard-card">
    <div class="label">Welcome Aboard</div>
    <p>Before we bring the bridge online, tell us who's flying. This is saved to your device.</p>
    <input id="ship-input" maxlength="24" placeholder="Name your ship (e.g. Amaranth)">
    <input id="captain-input" maxlength="24" placeholder="Your name, Captain">
    <button id="begin-btn">Take the Helm</button>
  </div>
</div>

<div id="shell">
  <div class="header-row">
    <div class="elbow"></div>
    <div class="header-bar">
      <div class="shipname" id="hdr-shipname">USS AMARANTH</div>
      <div id="hdr-alert" class="hdr-alert"></div>
      <div class="hb-right" id="hdr-right"></div>
    </div>
  </div>
  <div class="header-sub"><div class="hs1"></div><div class="hs2"></div><div class="hs3"></div></div>

  <div class="grid" id="layout">
    <div class="nav" id="nav-row">
      <button class="nav-pill" data-view="missions">Missions<span class="k">01</span></button>
      <button class="nav-pill" data-view="deck">Deck Plan<span class="k">02</span></button>
      <button class="nav-pill" data-view="flight">Flight Deck<span class="k">03</span></button>
      <button class="nav-pill" data-view="away">Away Team<span class="k">04</span></button>
      <button class="nav-pill" data-view="crew">Crew<span class="k">05</span></button>
      <button class="nav-pill" data-view="cargo">Cargo Hold<span class="k">06</span></button>
      <button class="nav-pill" data-view="log">Holo-Log<span class="k">07</span></button>
      <button class="nav-pill" data-view="settings">Settings<span class="k">08</span></button>
    </div>
    <div class="main" id="content"></div>
  </div>
</div>

<div id="modal-overlay">
  <div class="modal">
    <span class="tag" id="modal-tag">Mission</span>
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <button class="closebtn" id="modal-close">Return to Bridge</button>
  </div>
</div>

<script>
(async function(){
  const onboard = document.getElementById('onboard');
  const shell = document.getElementById('shell');
  const content = document.getElementById('content');
  const navRow = document.getElementById('nav-row');
  const layout = document.getElementById('layout');
  const hdrShip = document.getElementById('hdr-shipname');
  const hdrRight = document.getElementById('hdr-right');

  let shipName = 'AMARANTH';
  function shipDisplayName(){ return shipName.charAt(0) + shipName.slice(1).toLowerCase(); }
  // some flavor lines live in top-level consts evaluated once at script load, before any saved
  // profile is applied - a template literal there would freeze at the default name forever. This
  // token gets substituted at display time instead, wherever a line is actually about to be shown.
  function subShip(text){ return text.replace(/⟧SHIP⟨/g, shipDisplayName()).replace(/\{\{PET\}\}/g, dashName); }
  let dashName = 'Dash';

  // ---------- profile ----------
  let profile = null;
  try{
    const raw = localStorage.getItem('captain-profile');
    if(raw) profile = JSON.parse(raw);
  }catch(e){ profile = null; }

  // ---------- persistent ship state (hull/power/morale/log) ----------
  let shipState = { hull:100, power:87, morale:92, glimmerite:0, alertCondition:'green', deliveries:0, deliveriesByDestination:{}, completed:{cargo:0, diplomacy:0, defense:0, shipboard:0, guests:0}, roomActions:{}, rapport:{}, milestones:{}, keepsakes:{}, awayKeepsakes:{}, storyFlags:{}, lastSeen:null, bestTimeTrial:null, log:[] };
  // set by an active mission to let room content (items, crew lines) shift context while that mission is running
  let activeMissionContext = null;
  // checks an entry's flagLines against permanent story flags — the connective-tissue hook.
  // any item/crew/supplementary-crew entry can define flagLines:{ someFlag: [...] } and once
  // shipState.storyFlags[someFlag] is set, those lines are used instead of the defaults, forever.
  // shared unlock check: {type:'flag', flag:'x'} checks storyFlags; {type:'missionId', ...} checks completion count.
  function requirementMet(requires){
    if(!requires) return true;
    if(requires.type==='flag') return !!(shipState.storyFlags && shipState.storyFlags[requires.flag]);
    return (shipState.completed[requires.type] || 0) > 0;
  }
  function pickFlagLines(entry){
    let lines = entry.lines;
    if(entry.flagLines){
      for(const flag in entry.flagLines){
        if(shipState.storyFlags && shipState.storyFlags[flag]){ lines = entry.flagLines[flag]; break; }
      }
    }
    return lines.map(subShip);
  }
  // shared by items, senior crew talk lines, and supplementary crew lines: returns the
  // context-specific line set if a mission has one for this entry, otherwise falls through
  // to story-flag-aware lines, otherwise the plain default.
  function pickLines(entry){
    if(activeMissionContext && entry.contextLines && entry.contextLines[activeMissionContext]){
      return entry.contextLines[activeMissionContext].map(subShip);
    }
    return pickFlagLines(entry);
  }

  // human-readable readout of story flags — each thread lists its stages from most to least
  // advanced; only the most advanced matching stage is shown, nothing shows until a flag is set.
  const leadsConfig = [
    { id:'signal', name:'The Signal', stages:[
      { flag:'signalOpened', text:"Thessaly is open. Yeth's people know what the ruins mean now — there's no putting that back, and everyone aboard is still living with what that decision cost." },
      { flag:'signalProtected', text:"Thessaly stays closed, for now, on the ⟧SHIP⟨'s own call. Not everyone aboard agrees it was the right one." },
      { flag:'signalShared', text:"Thessaly is under shared stewardship now — the Aurin, the Concord, and the ⟧SHIP⟨ all at the same table. Rook still calls it the harder road." },
      { flag:'concordDelegationPending', text:"The Vell Concord knows about Thessaly now, and they're preparing to send their own delegation — with or without the ⟧SHIP⟨. Waiting isn't really an option anymore." },
      { flag:'thessalyLinked', text:"The resonance pattern matches Thessaly's ruins exactly — the same signature as the Aurin Wayfinder's Focal Point. Whoever built both wasn't leaving a warning. It reads more like a name." },
      { flag:'signalInvestigated', text:"Traced to a quiet stretch of space near Aurin territory — the Ship-Mind's Focal Point on the Wayfinder responded to it directly. Worth a closer look, next visit." },
      { flag:'signalDetected', text:"A faint, looping transmission at the edge of sensor range. Not part of the usual traffic. An Anomaly Survey might trace it." }
    ]}
  ];

  // Episode tracker: shown at the top of Missions, always. Each chapter's steps are checked in
  // order; the first one whose doneFlag isn't set yet is "next" and gets a Take Me There button.
  const episodesConfig = [
    {
      id:'signal', title:'The Signal', number:'01', requires:null, port:'Thessaly',
      get blurb(){ return `A faint transmission leads the ${shipDisplayName()} to an unexpected connection between a newly encountered civilization and the ruins of an uncharted world.`; },
      resetFlags:['signalDetected','signalInvestigated','thessalyLinked','concordDelegationPending','signalResolved','signalOpened','signalProtected','signalShared','homecomingComplete'],
      resetGates:['bridge:sensor-sweep'],
      resetMissions:['signalCh3','signalCh4','signalCh5'],
      chapters:[
        { num:1, title:'First Contact', doneFlag:'signalInvestigated', requires:null,
          steps:[
            { doneFlag:'signalDetected', hint:"Run a Sensor Sweep on the Bridge.", loc:'bridge', actionTarget:'bridge:sensor-sweep', go:()=>goToRoom('bridge') },
            { doneFlag:'signalInvestigated', hint:"Complete a full Anomaly Survey circuit (Starship, Flight Deck).", actionTarget:'flight:anomaly', go:()=>renderObjectiveSelect('starship') }
          ]},
        { num:2, title:'Old Ground', doneFlag:'thessalyLinked', requires:{type:'flag', flag:'signalInvestigated'},
          steps:[
            { doneFlag:'thessalyLinked', hint:"Run an Energy scan at Thessaly's Ruins (Away Team).", loc:'thessaly:ruins', go:()=>renderPlanet('thessaly','ruins') }
          ]},
        { num:3, title:'Attention', doneFlag:'concordDelegationPending', requires:{type:'flag', flag:'thessalyLinked'}, replayable:true,
          steps:[
            { doneFlag:'concordDelegationPending', hint:"Play the mission: Attention.", go:()=>startMission('signalCh3') }
          ]},
        { num:4, title:'The Choice', doneFlag:'signalResolved', requires:{type:'flag', flag:'concordDelegationPending'}, replayable:true,
          steps:[
            { doneFlag:'signalResolved', hint:"Play the mission: The Choice.", go:()=>startSpatialMission('signalCh4') }
          ]},
        { num:5, title:'Homecoming', doneFlag:'homecomingComplete', requires:{type:'flag', flag:'signalResolved'}, replayable:true,
          steps:[
            { doneFlag:'homecomingComplete', hint:"Play the mission: Homecoming.", loc:'bridge', go:()=>startSpatialMission('signalCh5') }
          ]}
      ]
    },
    {
      id:'quietplace', title:'A Quiet Place', number:'02', requires:{type:'flag', flag:'homecomingComplete'}, port:'Aldergrove',
      blurb:"A routine survey turns up something unexpected — deliberate, built structures on an otherwise pristine, seemingly uninhabited world.",
      resetFlags:['aldergroveDetected','aldergroveHistoryLearned','aldergroveThreatened','aldergroveResolved','aldergroveIsolated','aldergroveContacted','aldergroveNeutral'],
      resetGates:[],
      resetMissions:['quietCh1','quietCh2','quietCh3','quietCh4'],
      chapters:[
        { num:1, title:'Quiet World', doneFlag:'aldergroveDetected', requires:null,
          steps:[
            { doneFlag:'aldergroveDetected', hint:"Play the mission: Quiet World.", go:()=>startMission('quietCh1') }
          ]},
        { num:2, title:'Why They Stayed', doneFlag:'aldergroveHistoryLearned', requires:{type:'flag', flag:'aldergroveDetected'},
          steps:[
            { doneFlag:'aldergroveHistoryLearned', hint:"Play the mission: Why They Stayed.", loc:'aldergrove:outskirts', go:()=>startSpatialMission('quietCh2') }
          ]},
        { num:3, title:'The Complication', doneFlag:'aldergroveThreatened', requires:{type:'flag', flag:'aldergroveHistoryLearned'},
          steps:[

          ]},
        { num:4, title:'The Decision', doneFlag:'aldergroveResolved', requires:{type:'flag', flag:'aldergroveThreatened'}, replayable:true,
          steps:[

          ]}
      ]
    },
    {
      id:'opendoor', title:'An Open Door', number:'03', requires:{type:'flag', flag:'aldergroveResolved'}, port:'Deep Space',
      blurb:"The Vell Concord asks for something they've never asked an outsider before — not a visit, but a seat at something personal.",
      resetFlags:['ossoryInvited','ossoryHistoryKnown','ossoryWitnessed','ossoryWitnessedQuietly','ossorySpokeUp','ossoryResolved'],
      resetGates:[],
      resetMissions:['doorCh1','doorCh2','doorCh3','doorCh4'],
      chapters:[
        { num:1, title:'The Invitation', doneFlag:'ossoryInvited', requires:null,
          steps:[
            { doneFlag:'ossoryInvited', hint:"Play the mission: The Invitation.", go:()=>startMission('doorCh1') }
          ]},
        { num:2, title:'Old History', doneFlag:'ossoryHistoryKnown', requires:{type:'flag', flag:'ossoryInvited'},
          steps:[
            { doneFlag:'ossoryHistoryKnown', hint:"Play the mission: Old History.", go:()=>startMission('doorCh2') }
          ]},
        { num:3, title:'The Gathering', doneFlag:'ossoryWitnessed', requires:{type:'flag', flag:'ossoryHistoryKnown'},
          steps:[
            { doneFlag:'ossoryWitnessed', hint:"Play the mission: The Gathering.", loc:'obs', go:()=>startDoorCh3() }
          ]},
        { num:4, title:'What Holds', doneFlag:'ossoryResolved', requires:{type:'flag', flag:'ossoryWitnessed'}, replayable:true,
          steps:[
            { doneFlag:'ossoryResolved', hint:"Play the mission: What Holds.", go:()=>startMission('doorCh4') }
          ]}
      ]
    },
    {
      id:'holodeck', title:'Program Integrity', number:'04', requires:{type:'flag', flag:'ossoryResolved'}, port:'Deep Space',

      resetGates:[],
      resetMissions:['holoCh1','holoCh2','holoCh3','holoCh4'],
      chapters:[

          ]},
        { num:2, title:'It Knows Things', doneFlag:'holodeckContaminationConfirmed', requires:{type:'flag', flag:'holodeckGlitchFound'},
          steps:[

          ]},
        { num:3, title:'Following the Thread', doneFlag:'holodeckMechanismUnderstood', requires:{type:'flag', flag:'holodeckContaminationConfirmed'},
          steps:[

          ]},
        { num:4, title:"What It's Become", doneFlag:'holodeckResolved', requires:{type:'flag', flag:'holodeckMechanismUnderstood'}, replayable:true,
          steps:[
            { doneFlag:'holodeckResolved', hint:"Play the mission: What It's Become.", loc:'bridge', go:()=>startSpatialMission('holoCh4') }

    {

      blurb:"A coolant regulator drifts out of calibration, overloads a relay, and the ship drops out of warp hard — stuck, and the fix is not as simple as it looks.",
      resetFlags:['warpFailureFound','warpDiagnosisCareful','secondFaultFound','thirdFaultFound','warpDebrisFirst','warpRestored','warpFullRestart'],
      resetGates:['story:warpFailure','story:warpRestart'],
      resetMissions:['warpCh1','warpCh2','warpCh3','warpCh4'],
      chapters:[
        { num:1, title:'The Failure', doneFlag:'warpFailureFound', requires:null,
          steps:[
            { doneFlag:'warpFailureFound', hint:"Play the mission: The Failure.", go:()=>startMission('warpCh1') }
          ]},
        { num:2, title:'Not Just One Thing', doneFlag:'secondFaultFound', requires:{type:'flag', flag:'warpFailureFound'},
          steps:[
            { doneFlag:'secondFaultFound', hint:"Play the mission: Not Just One Thing.", go:()=>startMission('warpCh2') }
          ]},
        { num:3, title:'Three Small Things', doneFlag:'thirdFaultFound', requires:{type:'flag', flag:'secondFaultFound'},
          steps:[
            { doneFlag:'thirdFaultFound', hint:"Play the mission: Three Small Things.", go:()=>startMission('warpCh3') }
          ]},
        { num:4, title:'Underway Again', doneFlag:'warpRestored', requires:{type:'flag', flag:'thirdFaultFound'}, replayable:true,
          steps:[
            { doneFlag:'warpRestored', hint:"Play the mission: Underway Again.", go:()=>startMission('warpCh4') }
          ]}
      ]
    },
    {
      id:'emptyship', title:'The Empty Ship', number:'06', requires:{type:'flag', flag:'warpRestored'}, port:'The Lastlight',
      blurb:"An ancient, nearly powerless vessel drifts in open space — no distress call, no visible damage, and something deep inside it that shouldn't still be running.",
      resetFlags:['lastlightFound','lastlightGenerationsFound','lastlightRouteFound','lastlightBeaconSustained','lastlightResolved','lastlightInvestigateNow'],
      resetGates:[],
      resetMissions:['driftCh1','driftCh2','driftCh3','driftCh4'],
      chapters:[

          ]},

          steps:[

    },
    {

      resetFlags:['foldFirstContact','foldProbedAggressive','foldCaught','foldRouteFound','foldPushedHard','foldCleared'],

      resetMissions:['foldCh1','foldCh2','foldCh3','foldCh4'],
      chapters:[
        { num:1, title:'First Contact with the Fold', doneFlag:'foldFirstContact', requires:null,

          ]}
      ]
    },
    {
      id:'vosscorridor', title:'The Voss Corridor', number:'08', requires:{type:'flag', flag:'foldCleared'}, port:'Voss Corridor',
      blurb:"A fragile ceasefire, a diplomat with a real chance of holding it together, and a border that everyone aboard understands matters.",
      resetFlags:['vossCourierComplete','vossReyvaCaptured','vossReyvaInjured','vossExtractionComplete','vossCeasefireHolds'],

      resetMissions:['vossCh1','vossCh2','vossCh3','vossCh4'],
      chapters:[
        { num:1, title:'Courier', doneFlag:'vossCourierComplete', requires:null,
          steps:[
            { doneFlag:'vossCourierComplete', hint:"Play the mission: Courier.", actionTarget:'flight:courier', go:()=>startMission('vossCh1') }
          ]},

          steps:[

  function flagIsSet(flag){ return !!(flag && shipState.storyFlags && shipState.storyFlags[flag]); }
  // Chapter 5 has no single task to flag as done - instead, it's complete once the player has
  // talked to any of the three central crew after the episode resolved. Computed from log history
  // rather than a stored flag, so it works retroactively for conversations that already happened.
  function homecomingComplete(){
    if(!flagIsSet('signalResolved')) return false;
    const resolved = shipState.log.slice().reverse().find(e=>e.title==='The Choice');
    const cutoff = resolved ? resolved.t : 0;
    return shipState.log.some(e => e.t >= cutoff && ['Talked with Wren','Talked with Rook','Talked with Sable'].includes(e.title));
  }
  function chapterComplete(ch){

  // finds the first available-but-incomplete, non-ongoing chapter across all unlocked episodes,

  // guidance banners and the room/objective highlighting.
  function getActiveChapterStep(){
    for(const ep of episodesConfig){
      if(!requirementMet(ep.requires)) continue;
      for(const ch of ep.chapters){
        if(ch.ongoing) continue;
        const complete = chapterComplete(ch);
        const available = complete || requirementMet(ch.requires);
        if(available && !complete){
          const nextStep = ch.steps.find(s=>!flagIsSet(s.doneFlag)) || ch.steps[ch.steps.length-1];
          return { ep, ch, nextStep };
        }
      }
    }
    return null;
  }

      const replayWarning = hasDependent
        ? "Resets this episode's story flags and any daily gates it uses. Ship stats, rapport, and side missions stay exactly as they are — but any later episode that depends on this one being resolved will disappear from Missions until you finish it again."
        : "Resets this episode's story flags and any daily gates it uses. Doesn't touch anything else — ship stats, rapport, and other episodes/missions stay exactly as they are.";

  async function replayEpisode(ep){
    if(shipState.storyFlags) ep.resetFlags.forEach(f=>delete shipState.storyFlags[f]);
    if(shipState.roomActions) ep.resetGates.forEach(g=>delete shipState.roomActions[g]);
    if(shipState.completed) ep.resetMissions.forEach(m=>{ shipState.completed[m] = 0; });
    // Restore Hull/Power/Morale to their resting baseline when replaying. Without this, a
    // second attempt at story-driven stat costs stacks directly on top of the first attempt's
    // already-applied damage rather than starting clean, since story flags/completion resetting
    // has never touched ship condition. Confirmed as a real bug via a player's Holo-Log showing
    // duplicate chapter-completion entries after a replay.
    shipState.hull = DRIFT_TARGETS.hull;
    shipState.power = DRIFT_TARGETS.power;
    shipState.morale = DRIFT_TARGETS.morale;
    activeSpatial = null;
    activeMissionContext = null;
    completedSpatialSummary = null;
    try{
      await saveShipState();
    }catch(e){
      console.error('Failed to save after replaying the episode:', e);
    }
    goToRoom('bridge');
  }

  async function loadShipState(){
    try{
      const raw = localStorage.getItem('ship-state');
      if(raw){
        const loaded = JSON.parse(raw);
        shipState = Object.assign({hull:100,power:87,morale:92,glimmerite:0,deliveries:0,deliveriesByDestination:{},completed:{cargo:0,diplomacy:0,defense:0,shipboard:0,guests:0},roomActions:{},rapport:{},milestones:{},keepsakes:{},awayKeepsakes:{},storyFlags:{},lastSeen:null,bestTimeTrial:null,log:[]}, loaded);
        if(!loaded.completed){
          // migrate from the earlier single-mission counter
          shipState.completed = {cargo: loaded.missionsCompleted||0, diplomacy:0, defense:0, shipboard:0, guests:0};
        }
        if(shipState.completed.shipboard===undefined) shipState.completed.shipboard = 0;

      }
    }catch(e){ /* no saved state yet — defaults stand */ }

  async function saveShipState(){
    try{ localStorage.setItem('ship-state', JSON.stringify(shipState)); }catch(e){}

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  // gently pulls hull/power/morale back toward their baseline defaults based on real time
  // elapsed since the last visit — framed as routine upkeep, never a punishment.
  const DRIFT_TARGETS = { hull:100, power:87, morale:92 };
  const DRIFT_RATE_PER_HOUR = 0.6;
  async function applyStateDrift(){
    const now = Date.now();
    if(!shipState.lastSeen){
      shipState.lastSeen = now;
      await saveShipState();
      return null;
    }
    const hoursElapsed = (now - shipState.lastSeen) / 3600000;
    shipState.lastSeen = now;
    if(hoursElapsed < 1){
      await saveShipState();
      return null;
    }
    const before = { hull:shipState.hull, power:shipState.power, morale:shipState.morale };
    Object.keys(DRIFT_TARGETS).forEach(k=>{
      const target = DRIFT_TARGETS[k];
      const diff = target - shipState[k];
      const move = Math.sign(diff) * Math.min(Math.abs(diff), DRIFT_RATE_PER_HOUR * hoursElapsed);
      shipState[k] = clamp(Math.round(shipState[k] + move));
    });
    const totals = { hull:shipState.hull-before.hull, power:shipState.power-before.power, morale:shipState.morale-before.morale };
    const changed = totals.hull || totals.power || totals.morale;
    let result = null;
    if(changed){
      const days = hoursElapsed/24;
      const timeDesc = days>=1 ? `${Math.floor(days)} day${Math.floor(days)===1?'':'s'}` : `${Math.round(hoursElapsed)} hour${Math.round(hoursElapsed)===1?'':'s'}`;
      const line = `The ship ran quietly for about ${timeDesc} — no emergencies, just routine upkeep and the ordinary rhythm of the crew.`;
      shipState.log.unshift({ t:now, title:'While you were away', lines:[line], totals });
      result = { timeDesc, totals };
    }
    await saveShipState();
    return result;
  }

  function usedToday(key){
    const t = shipState.roomActions && shipState.roomActions[key];
    if(!t) return false;
    return new Date(t).toDateString() === new Date().toDateString();
  }
  async function grantRoomReward(deltas, title, logLine, roomKey){
    shipState.hull = clamp(shipState.hull + (deltas.hull||0));
    shipState.power = clamp(shipState.power + (deltas.power||0));
    shipState.morale = clamp(shipState.morale + (deltas.morale||0));
    if(deltas.glimmerite) shipState.glimmerite += deltas.glimmerite;
    shipState.log.unshift({ t:Date.now(), title, lines:[logLine], totals:deltas });
    if(!shipState.roomActions) shipState.roomActions = {};
    shipState.roomActions[roomKey] = Date.now();
    await saveShipState();
  }

  // ---------- Stabilize the Core minigame (Engineering) ----------
  function runStabilizeMinigame(container, action, cooldownKey, btn){
    const target = 5;
    let hits = 0;
    let pos = 0, dir = 1, rafId;
    container.innerHTML = `
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px;">Click STABILIZE when the indicator crosses the green zone. Need ${target} good hits.</div>
      <div class="stabilize-track"><div class="stabilize-zone"></div><div class="stabilize-indicator" id="stab-indicator"></div></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
        <button class="primary-btn" id="stab-hit-btn">STABILIZE</button>
        <span style="font-size:11px;color:var(--gold);" id="stab-status">Hits: 0/${target}</span>
      </div>`;
    const indicator = document.getElementById('stab-indicator');
    const statusEl = document.getElementById('stab-status');
    function step(){
      pos += dir * 0.018;
      if(pos>=1){ pos=1; dir=-1; }
      if(pos<=0){ pos=0; dir=1; }
      indicator.style.left = (pos*94)+'%';
      rafId = requestAnimationFrame(step);
    }
    step();
    document.getElementById('stab-hit-btn').addEventListener('click', async ()=>{
      const inZone = pos>=0.4 && pos<=0.6;
      if(inZone){
        hits++;
        statusEl.textContent = `Hits: ${hits}/${target}`;
      } else {
        statusEl.style.color = 'var(--rose)';
        setTimeout(()=>{ statusEl.style.color='var(--gold)'; }, 250);
      }
      if(hits>=target){
        cancelAnimationFrame(rafId);
        const line = action.lines[Math.floor(Math.random()*action.lines.length)];
        container.innerHTML = `<div style="font-size:11px;color:var(--gold);">${line}</div>`;
        await grantRoomReward(action.deltas, action.title, line, cooldownKey);
        btn.style.display = 'inline-block';
        btn.disabled = true;
        btn.textContent = 'Already done today';
      }
    });
  }

  // ---------- Synchronize the Reset minigame (Engineering) ----------
  // Adapted from the story-exclusive version in Episode 5 Chapter 3 - same two-dot convergence
  // mechanic, wired into the standard grantRoomReward/cooldown pattern instead of a linear
  // mission flow, since this version never leads anywhere - it just resolves in place.
  function runSyncResetMinigame(container, action, cooldownKey, btn){
    container.innerHTML = `
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px;">Watch the two indicators. Lock the sync the instant they align.</div>
      <div style="position:relative;height:60px;background:rgba(0,0,0,0.25);border-radius:8px;overflow:hidden;margin-bottom:12px;">
        <div id="sync-core-dot" style="position:absolute;top:10px;width:14px;height:14px;border-radius:50%;background:var(--gold);"></div>

      </div>
      <button class="primary-btn" id="sync-lock-btn">LOCK SYNC</button>
      <div id="sync-result" style="margin-top:8px;font-size:11px;color:var(--gold);min-height:14px;"></div>
    `;
    const coreDot = document.getElementById('sync-core-dot');
    const powerDot = document.getElementById('sync-power-dot');
    const trackWidth = 280;
    let t = 0, running = true;
    function frame(){
      if(!running) return;
      t += 1;
      const corePos = (Math.sin(t*0.045)+1)/2 * trackWidth;
      const powerPos = (Math.sin(t*0.031)+1)/2 * trackWidth;
      coreDot.style.left = corePos + 'px';
      powerDot.style.left = powerPos + 'px';
      coreDot.dataset.pos = corePos;
      powerDot.dataset.pos = powerPos;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    document.getElementById('sync-lock-btn').addEventListener('click', async ()=>{
      const corePos = parseFloat(coreDot.dataset.pos||0);
      const powerPos = parseFloat(powerDot.dataset.pos||0);
      const diff = Math.abs(corePos-powerPos);
      const resultEl = document.getElementById('sync-result');
      if(diff < 18){
        running = false;
        const line = action.lines[Math.floor(Math.random()*action.lines.length)];
        resultEl.textContent = line;
        document.getElementById('sync-lock-btn').disabled = true;
        document.getElementById('sync-lock-btn').textContent = 'Synced';
        await grantRoomReward(action.deltas, action.title, line, cooldownKey);
        btn.style.display = 'inline-block';
        btn.disabled = true;
        btn.textContent = 'Already done today';
      } else {
        resultEl.textContent = "Not quite aligned yet — watch for the next pass.";
      }
    });
  }

      blip.className = 'diag-blip';
      blip.style.left = (10 + Math.random()*75) + '%';
      blip.style.top = (10 + Math.random()*70) + '%';
      let caughtThis = false;
      blip.addEventListener('click', ()=>{
        if(caughtThis) return;
        caughtThis = true;
        caught++;
        statusEl.textContent = `Caught: ${caught}/${target}`;
        blip.remove();
      });
      panel.appendChild(blip);
      setTimeout(()=>{
        if(blip.parentNode) blip.remove();
        setTimeout(spawnBlip, 300);
      }, 1300);
    }
    async function finish(){
      const line = action.lines[Math.floor(Math.random()*action.lines.length)];
      container.innerHTML = `<div style="font-size:11px;color:var(--gold);">${line}</div>`;
      await grantRoomReward(action.deltas, action.title, line, cooldownKey);
      btn.style.display = 'inline-block';
      btn.disabled = true;
      btn.textContent = 'Already done today';
    }
    spawnBlip();
  }

  function rapportTier(v){
    if(v >= 80) return 'Close Friend';
    if(v >= 50) return 'Trusted';
    if(v >= 20) return 'Getting Acquainted';
    return 'Just Met';
  }

  // updates rapport and fires the one-time Close Friend milestone if newly crossed; returns true if it fired
  function applyRapportGain(crewKey, amount){
    if(!shipState.rapport) shipState.rapport = {};
    if(!shipState.milestones) shipState.milestones = {};
    const prev = shipState.rapport[crewKey] || 0;
    const next = clamp(prev + amount);
    shipState.rapport[crewKey] = next;
    if(next >= 80 && prev < 80 && !shipState.milestones[crewKey]){
      shipState.milestones[crewKey] = true;
      shipState.morale = clamp(shipState.morale + 3);
      const c = crewData[crewKey];
      shipState.log.unshift({ t:Date.now(), title:'Close Friends with '+c.name, lines:[milestoneConfig[crewKey]], totals:{morale:3} });
      return true;
    }
    return false;
  }

  async function grantCrewTalk(crewKey, logLine){
    const c = crewData[crewKey];
    shipState.morale = clamp(shipState.morale + 1);
    shipState.log.unshift({ t:Date.now(), title:'Talked with '+c.name, lines:[logLine], totals:{morale:1} });
    applyRapportGain(crewKey, 3);
    if(!shipState.roomActions) shipState.roomActions = {};
    shipState.roomActions['crew:'+crewKey] = Date.now();
    await saveShipState();
  }

  async function grantFavor(crewKey, logLine){
    const c = crewData[crewKey];
    const cfg = favorConfig[crewKey];
    shipState.hull = clamp(shipState.hull + (cfg.deltas.hull||0));
    shipState.power = clamp(shipState.power + (cfg.deltas.power||0));
    shipState.morale = clamp(shipState.morale + (cfg.deltas.morale||0));
    if(cfg.deltas.glimmerite) shipState.glimmerite += cfg.deltas.glimmerite;
    shipState.log.unshift({ t:Date.now(), title:'Favor from '+c.name, lines:[logLine], totals:cfg.deltas });
    applyRapportGain(crewKey, 4);

  // ---------- generic starfield helper ----------
  function animateStars(id, extra){
    const canvas = document.getElementById(id);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = canvas.clientWidth*devicePixelRatio; canvas.height = canvas.clientHeight*devicePixelRatio; }
    resize(); window.addEventListener('resize', resize);
    const stars = Array.from({length:110}, ()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.3,tw:Math.random()*Math.PI*2}));
    let t=0;
    function draw(){
      t+=0.02;
      const w=canvas.width,h=canvas.height;
      ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
      stars.forEach(s=>{
        const a=0.4+0.5*Math.sin(t+s.tw);
        ctx.fillStyle=`rgba(242,236,221,${a})`;
        ctx.beginPath(); ctx.arc(s.x*w,s.y*h,s.r*devicePixelRatio,0,Math.PI*2); ctx.fill();
      });
      if(extra) extra(ctx,w,h,t);
      requestAnimationFrame(draw);
    }
    draw();
  }
