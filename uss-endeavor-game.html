  function runFlightSim(c, craftKey, objKey, destKey){
    const canvas = document.getElementById('flight-canvas');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = canvas.clientWidth*devicePixelRatio; canvas.height = canvas.clientHeight*devicePixelRatio; }
    resize(); window.addEventListener('resize', resize);

    const hudRings = document.getElementById('hud-rings');
    const hudObj = document.getElementById('hud-obj');
    const toastEl = document.getElementById('flight-toast');
    function toast(msg){
      toastEl.textContent = msg; toastEl.classList.add('show');
      setTimeout(()=>toastEl.classList.remove('show'), 1800);
    }

    const ship = { x:0.5, y:0.5, vx:0, vy:0, angle:-Math.PI/2 };
    const keys = { left:false, right:false, thrust:false };
    let ringsCollected = 0;
    let rings = [];

    function spawnRings(){
      rings = [];
      for(let i=0;i<5;i++){
        rings.push({
          x: 0.15 + Math.random()*0.7,
          y: 0.15 + Math.random()*0.7,
          r: 0.045, collected:false, pulse: Math.random()*Math.PI*2
        });
      }
    }
    spawnRings();

    // ---- objective-specific setup ----
    const beacon = objKey==='prospect' ? {x:0.12, y:0.15, r:0.045, wasInside:false} : null;
    const pickup = objKey==='cargo' ? {x:0.12, y:0.85, r:0.045, wasInside:false} : null;
    const dest = (objKey==='cargo' || objKey==='supply') ? destinationsData[destKey] : null;
    const dropoff = (objKey==='cargo' || objKey==='supply') ? {x:dest.pos.x, y:dest.pos.y, r:0.045, wasInside:false} : null;
    let ore = [];
    let carrying = 0;
    let cargoLoaded = false;

    function spawnOre(){
      ore = [];
      for(let i=0;i<6;i++){
        ore.push({
          x: 0.22 + Math.random()*0.56,
          y: 0.22 + Math.random()*0.56,
          r: 0.028, collected:false, pulse: Math.random()*Math.PI*2
        });
      }
    }
    if(objKey==='prospect') spawnOre();

    // ---- convoy escort setup ----
    let convoy = [];
    let escortedCount = 0;
    function spawnConvoy(){
      convoy = [];
      for(let i=0;i<3;i++){
        convoy.push({ x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.04, escorted:false, pulse:Math.random()*Math.PI*2 });
      }
    }
    if(objKey==='escort') spawnConvoy();
    const escortBeacon = objKey==='escort' ? {x:0.12, y:0.85, r:0.045, wasInside:false} : null;

    // ---- anomaly survey setup ----
    let anomalies = [];
    let anomaliesScanned = 0;
    const anomalyLines = [
      "A faint gravitational eddy — nothing dangerous, just a curious ripple in local space.",
      "Residual energy signature, non-hostile. Wren's going to have opinions about this one.",
      "A pocket of unusually dense stellar dust, sparkling faintly. Logged for further study.",
      "Some kind of resonance echo — probably natural, possibly not. Definitely going in the journal."
    ];
    function spawnAnomalies(){
      anomalies = [];
      for(let i=0;i<4;i++){
        anomalies.push({ x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.035, scanned:false, pulse:Math.random()*Math.PI*2 });
      }
    }
    if(objKey==='anomaly') spawnAnomalies();

    // ---- reference lock setup (Episode 7 Ch3/Ch4) - structurally identical to anomaly survey,
    // separate objKey and variable namespace so it can't collide with Episode 1's anomaly hook.
    // Target count is configurable (foldReflockTarget, set before launch) so Chapter 4 can reuse
    // this exact mechanic at a shorter length (3 points) rather than needing a second objective.
    // The Chapter 1 payoff is a starting-state difference, not new mechanics: aggressive path
    // starts with one point already counted as locked.
    let refPoints = [];
    const reflockTarget = (typeof foldReflockTarget !== 'undefined' && foldReflockTarget) ? foldReflockTarget : 4;
    let refPointsLocked = flagIsSet('foldProbedAggressive') ? 1 : 0;
    const refLockLines = [
      "This one's holding steady relative to the ship — not moving with the fold, not moving with us either. A genuine fixed point.",
      "Confirmed stable. Whatever's warping everything else out here, this reference isn't affected by it.",
      "Locked. Mira logs the bearing before anything has a chance to shift again.",
      "Stable enough to build a heading from. Worth checking whether that's actually enough."
    ];
    function spawnRefPoints(){
      refPoints = [];
      for(let i=0;i<reflockTarget;i++){
        refPoints.push({ x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.035, locked:false, pulse:Math.random()*Math.PI*2 });
      }
    }
    if(objKey==='reflock') spawnRefPoints();

    // ---- diplomatic courier setup ----
    const courierDest = objKey==='courier' ? destinationsData[(typeof courierDestOverride !== 'undefined' && courierDestOverride) ? courierDestOverride : 'concord'] : null;
    const courierPickup = objKey==='courier' ? {x:0.15, y:0.82, r:0.045, wasInside:false} : null;
    const courierDropoff = objKey==='courier' ? {x:courierDest.pos.x, y:courierDest.pos.y, r:0.045, wasInside:false} : null;
    let dignitaryAboard = (objKey==='courier' && ((typeof voscourierPendingFlight !== 'undefined' && voscourierPendingFlight) || (typeof homeCh4PendingDocking !== 'undefined' && homeCh4PendingDocking)));
    let bumps = 0;
    const courierLines = {
      smooth:[
        "A perfectly smooth crossing. The dignitary complimented the flying before even stepping off — Rook will want to hear that.",
        "Not a single bump the whole way. The Concord representative seemed genuinely impressed."
      ],
      acceptable:[
        "A few bumps along the way, but nothing anyone mentioned out loud. Professional enough.",
        "Slightly rougher than ideal, but the dignitary didn't seem to hold it against you."
      ],
      rough:[
        "It was a bumpy ride. The dignitary was polite about it, which somehow made it worse.",
        "Rougher than planned. Rook's going to hear about this one way or another."
      ]
    };

    // ---- supply run setup ----
    let depots = [];
    let depotsCollected = 0;
    let suppliesConsolidated = false;
    function spawnDepots(){
      depots = [];
      for(let i=0;i<3;i++){
        depots.push({ x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.032, collected:false, pulse:Math.random()*Math.PI*2 });
      }
    }
    if(objKey==='supply') spawnDepots();

    // ---- emergency evac setup ----
    let pod = null;
    let podAboard = false;
    function spawnPod(){
      pod = { x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.035, collected:false, pulse:Math.random()*Math.PI*2 };
    }
    if(objKey==='evac') spawnPod();
    const evacSafeZone = objKey==='evac' ? {x:0.5, y:0.85, r:0.045, wasInside:false} : null;
    const evacLines = [
      "Brought the stranded prospector safely aboard. Dr. Amara had a blanket and a hot drink ready before they even reached the airlock.",
      "Recovered the pod without incident. The prospector was mostly just relieved to be somewhere warm — Dr. Amara made sure of the rest."
    ];

    // ---- debris clearance setup ----
    let debris = [];
    let debrisCleared = 0;
    let flashBolts = [];
    let lastFireTime = 0;
    const FIRE_COOLDOWN = 350;
    function spawnDebris(){
      debris = [];
      for(let i=0;i<6;i++){
        debris.push({ x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.03, alive:true, pulse:Math.random()*Math.PI*2 });
      }
    }
    if(objKey==='debris') spawnDebris();
    const debrisBeacon = objKey==='debris' ? {x:0.12, y:0.85, r:0.045, wasInside:false} : null;

    // ---- perimeter patrol setup ----
    let hostile = null;
    const interceptLines = [
      "Three clean hits and the scout's shields buckled — it broke off and fled before anything else could happen.",
      "The scout took the hint after the third hit, venting plasma and retreating fast. No real harm done, just a clear message."
    ];
    function spawnHostile(){
      hostile = {
        x: 0.2+Math.random()*0.6, y: 0.2+Math.random()*0.6,
        vx: (Math.random()-0.5)*0.003, vy: (Math.random()-0.5)*0.003,
        shields: 3, retreating: false, alive: true, retreatTimer: 0
      };
    }
    if(objKey==='intercept') spawnHostile();

    function findConeTarget(candidates, getPos, range, coneWidth){
      let target = null, bestDist = Infinity;
      candidates.forEach(cand=>{
        const p = getPos(cand);
        const dx = p.x-ship.x, dy = p.y-ship.y;
        const dist = Math.hypot(dx,dy);
        if(dist > range) return;
        let angleDiff = Math.atan2(dy,dx) - ship.angle;
        while(angleDiff > Math.PI) angleDiff -= Math.PI*2;
        while(angleDiff < -Math.PI) angleDiff += Math.PI*2;
        if(Math.abs(angleDiff) < coneWidth && dist < bestDist){ target = cand; bestDist = dist; }
      });
      return target;
    }

    function tryFire(){
      if(objKey!=='debris' && objKey!=='intercept') return;
      const now = Date.now();
      if(now - lastFireTime < FIRE_COOLDOWN) return;
      lastFireTime = now;

      if(objKey==='debris'){
        const target = findConeTarget(debris.filter(d=>d.alive), d=>d, 0.4, 0.35);
        const endX = target ? target.x : ship.x + Math.cos(ship.angle)*0.4;
        const endY = target ? target.y : ship.y + Math.sin(ship.angle)*0.4;
        flashBolts.push({ x1:ship.x, y1:ship.y, x2:endX, y2:endY, life:6 });
        if(target){
          target.alive = false;
          debrisCleared++;
          hudObj.textContent = `Debris cleared: ${debrisCleared}/6`;
          toast('Debris cleared');
          if(debrisCleared>=6){
            hudObj.textContent = 'Lane clear! Report to the checkpoint.';
            toast('All debris cleared — head to the checkpoint');
          }
        } else {
          toast('Missed — nothing in range');
        }
      } else if(objKey==='intercept'){
        if(!hostile || !hostile.alive || hostile.retreating){
          toast('No target in range');
          return;
        }
        const target = findConeTarget([hostile], h=>h, 0.45, 0.35);
        const endX = target ? target.x : ship.x + Math.cos(ship.angle)*0.4;
        const endY = target ? target.y : ship.y + Math.sin(ship.angle)*0.4;
        flashBolts.push({ x1:ship.x, y1:ship.y, x2:endX, y2:endY, life:6 });
        if(target){
          hostile.shields--;
          if(hostile.shields <= 0){
            hostile.retreating = true;
            if(typeof vossCh3PendingCombat !== 'undefined' && vossCh3PendingCombat){
              vossCh3PendingCombat = false;
              const aggressive = vossCh3State.riskChoice === 'aggressive';
              const hullCost = aggressive ? 16 : 8;
              const powerCost = aggressive ? 20 : 10;
              const moraleCost = aggressive ? 5 : 3;
              shipState.hull = clamp(shipState.hull - hullCost);
              shipState.power = clamp(shipState.power - powerCost);
              shipState.morale = clamp(shipState.morale - moraleCost);
              saveShipState();
              hudObj.textContent = 'Hostile retreating...';
              const banner = document.getElementById('flight-episode-banner');
              if(banner){
                banner.style.display = '';
                banner.innerHTML = `
                  <div>
                    <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 08</span><b>Clearing the Field</b></div>
                    <div class="mb-summary">The patrol breaks off. The way out is open, at least for now.</div>
                  </div>
                  <button class="primary-btn small" id="flight-episode-return">Continue</button>`;
                const returnBtn = document.getElementById('flight-episode-return');
                if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); vossCh3StepBreakContact(); });
              }
            } else {
              const line = interceptLines[Math.floor(Math.random()*interceptLines.length)];
              grantReward('Perimeter patrol', {morale:2}, line);
              applyRapportGain('bas', 2);
              saveShipState();
              toast('Hostile disabled — retreating! Morale +2, Bas +rapport');
              hudObj.textContent = 'Hostile retreating...';
            }
          } else {
            hudObj.textContent = `Hostile shields: ${hostile.shields}/3`;
            toast(`Hit! Shields ${hostile.shields}/3`);
          }
        } else {
          toast('Missed — not in your sights');
        }
      }
    }

    function tryTractor(){
      if(objKey!=='evac') return;
      const now = Date.now();
      if(now - lastFireTime < FIRE_COOLDOWN) return;
      lastFireTime = now;
      if(!pod || pod.collected){ toast('Nothing to tractor'); return; }
      const dx = pod.x-ship.x, dy = pod.y-ship.y;
      const dist = Math.hypot(dx,dy);
      if(dist > 0.4){ toast('Pod out of tractor range'); return; }
      let angleDiff = Math.atan2(dy,dx) - ship.angle;
      while(angleDiff > Math.PI) angleDiff -= Math.PI*2;
      while(angleDiff < -Math.PI) angleDiff += Math.PI*2;
      if(Math.abs(angleDiff) > 0.35){ toast('Aim the tractor beam at the pod'); return; }
      flashBolts.push({ x1:ship.x, y1:ship.y, x2:pod.x, y2:pod.y, life:6, tractor:true });
      pod.x += (ship.x-pod.x)*0.4;
      pod.y += (ship.y-pod.y)*0.4;
      const newDist = Math.hypot(pod.x-ship.x, pod.y-ship.y);
      if(newDist < 0.06){
        pod.collected = true; podAboard = true;
        hudObj.textContent = 'Pod: secured, return to the ship';
        toast('Pod secured — bringing them in gently.');
      } else {
        toast('Tractor beam locked — reeling it in...');
      }
    }

    // ---- time trial setup ----
    let trialStartTime = Date.now();

    // ---- mail run setup ----
    const mailStops = objKey==='mailrun'
      ? Object.entries(destinationsData)
          .filter(([k,d])=> requirementMet(d.requires))
          .map(([k,d])=>({ key:k, x:d.pos.x, y:d.pos.y, hex:d.hex, name:d.name, delivered:false }))
      : [];
    let mailDelivered = 0;
    let mailLoaded = false;
    const mailPickup = objKey==='mailrun' ? {x:0.12, y:0.85, r:0.045, wasInside:false} : null;

    // ---- crew ferry setup ----
    const ferryPickup = objKey==='ferry' ? {x:0.12, y:0.85, r:0.045, wasInside:false} : null;
    const ferryDropoff = objKey==='ferry' ? {x:destinationsData.wrenhaven.pos.x, y:destinationsData.wrenhaven.pos.y, r:0.045, wasInside:false} : null;
    let miraAboard = false;
    const ferryLines = [
      "Dropped Mira off at Wrenhaven for a well-earned day off. She saluted mockingly on the way out.",
      "Mira practically vaulted out of the shuttle the second it landed. Everyone needs a break sometimes."
    ];

    // ---- keyboard ----
    function down(e){
      if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
      if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
      if(['ArrowUp','w','W'].includes(e.key)) keys.thrust = true;
      if(e.key===' ' && (objKey==='debris'||objKey==='intercept')){ e.preventDefault(); tryFire(); }
      if(e.key===' ' && objKey==='evac'){ e.preventDefault(); tryTractor(); }
    }
    function up(e){
      if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
      if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
      if(['ArrowUp','w','W'].includes(e.key)) keys.thrust = false;
    }
    flightKeyHandlers = { down, up };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);

    // ---- on-screen controls ----
    function bindHold(id, setter){
      const el = document.getElementById(id);
      const on = (e)=>{ e.preventDefault(); setter(true); el.classList.add('pressed'); };
      const off = (e)=>{ setter(false); el.classList.remove('pressed'); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointerleave', off);
      el.addEventListener('pointercancel', off);
    }
    bindHold('ctrl-left', v=>keys.left=v);
    bindHold('ctrl-right', v=>keys.right=v);
    bindHold('ctrl-thrust', v=>keys.thrust=v);
    if(objKey==='debris' || objKey==='intercept'){
      const fireBtn = document.getElementById('ctrl-fire');
      fireBtn.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        tryFire();
        fireBtn.classList.add('pressed');
        setTimeout(()=>fireBtn.classList.remove('pressed'), 120);
      });
    }
    if(objKey==='evac'){
      const tractorBtn = document.getElementById('ctrl-fire');
      tractorBtn.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        tryTractor();
        tractorBtn.classList.add('pressed');
        setTimeout(()=>tractorBtn.classList.remove('pressed'), 120);
      });
    }

    async function grantReward(title, deltas, logLine){
      shipState.hull = clamp(shipState.hull + (deltas.hull||0));
      shipState.power = clamp(shipState.power + (deltas.power||0));
      shipState.morale = clamp(shipState.morale + (deltas.morale||0));
      const lines = Array.isArray(logLine) ? logLine : [logLine];
      shipState.log.unshift({ t:Date.now(), title, lines, totals:deltas });
      await saveShipState();
    }

    function step(){
      // physics
      if(keys.left) ship.angle -= c.turnRate;
      if(keys.right) ship.angle += c.turnRate;
      if(keys.thrust){
        ship.vx += Math.cos(ship.angle) * c.thrustAccel * 0.01;
        ship.vy += Math.sin(ship.angle) * c.thrustAccel * 0.01;
      }
      ship.vx *= c.drag; ship.vy *= c.drag;
      const speed = Math.hypot(ship.vx, ship.vy);
      const maxS = c.maxSpeed * 0.01;
      if(speed > maxS){ ship.vx = ship.vx/speed*maxS; ship.vy = ship.vy/speed*maxS; }
      ship.x += ship.vx; ship.y += ship.vy;
      // soft bounce off bounds
      const margin = 0.03;
      if(ship.x < margin){ ship.x = margin; ship.vx *= -0.4; if(objKey==='courier' && dignitaryAboard) bumps++; }
      if(ship.x > 1-margin){ ship.x = 1-margin; ship.vx *= -0.4; if(objKey==='courier' && dignitaryAboard) bumps++; }
      if(ship.y < margin){ ship.y = margin; ship.vy *= -0.4; if(objKey==='courier' && dignitaryAboard) bumps++; }
      if(ship.y > 1-margin){ ship.y = 1-margin; ship.vy *= -0.4; if(objKey==='courier' && dignitaryAboard) bumps++; }

      // ambient ring collection (all objectives)
      rings.forEach(r=>{
        if(r.collected) return;
        const d = Math.hypot(ship.x-r.x, ship.y-r.y);
        if(d < r.r + 0.02){
          r.collected = true; ringsCollected++;
          hudRings.textContent = ringsCollected + '/5';
          toast('Ring collected!');
          if(ringsCollected % 5 === 0){
            if(objKey==='timetrial'){
              const elapsed = (Date.now()-trialStartTime)/1000;
              let tier, moraleGain;
              if(elapsed <= 18){ tier='Gold'; moraleGain=3; }
              else if(elapsed <= 26){ tier='Silver'; moraleGain=2; }
              else { tier='Bronze'; moraleGain=1; }
              const isRecord = !shipState.bestTimeTrial || elapsed < shipState.bestTimeTrial;
              if(isRecord) shipState.bestTimeTrial = elapsed;
              const line = `Finished the circuit in ${elapsed.toFixed(1)}s — ${tier}${isRecord?' (new best!)':''}.`;
              grantReward('Time trial circuit', {morale:moraleGain}, line);
              toast(`${tier}! ${elapsed.toFixed(1)}s${isRecord?' — New record!':''}`);
              // ---- story beat: the first holodeck glitch, noticed mid-run, once Episode 3 has resolved ----
              if(flagIsSet('ossoryResolved') && !flagIsSet('holodeckGlitchFound')){
                if(!shipState.storyFlags) shipState.storyFlags = {};
                shipState.storyFlags.holodeckGlitchFound = true;
                const glitchLine = "For just a second, a gate marker flickers into something that isn't a gate at all — a weathered wooden sign, the kind from nowhere in this course. Mira (Conn Officer) almost calls it a rendering fault. Then, two turns later, it happens again — a voice this time, faint, saying something that has nothing to do with piloting at all. Gone before she can make out the words. She's already decided to flag this to Rook the moment she's done with the simulation.";
                const closingLine = "Whatever it is, it's not gone. Just quiet, for now.";
                shipState.completed.holoCh1 = (shipState.completed.holoCh1||0) + 1;
                shipState.log.unshift({ t:Date.now(), title:"Something's Wrong", lines:[glitchLine, closingLine], totals:{} });
                saveShipState();
                const banner = document.getElementById('flight-episode-banner');
                if(banner){
                  banner.style.display = '';
                  banner.innerHTML = `
                    <div>
                      <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 04</span><b>Chapter 1 Complete</b></div>
                      <div class="mb-summary">${glitchLine} ${closingLine}</div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                      <button class="primary-btn small" id="flight-episode-next">Begin: It Knows Things</button>
                      <button class="ghost-btn small" id="flight-episode-return">Return to Missions</button>
                    </div>`;
                  const nextBtn = document.getElementById('flight-episode-next');
                  if(nextBtn) nextBtn.addEventListener('click', ()=>{ stopFlightLoop(); startMission('holoCh2'); });
                  const returnBtn = document.getElementById('flight-episode-return');
                  if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); showScreen('missions'); });
                }
              }
              trialStartTime = Date.now();
            } else {
              toast('Circuit complete! Morale +1');
              grantReward('Free-flight circuit', {morale:1}, `Took the ${craftKey} through a full circuit of marker rings, just for the feel of it.`);
            }
            setTimeout(spawnRings, 400);
          }
        }
      });

      // ---- prospecting objective ----
      if(objKey==='prospect'){
        ore.forEach(o=>{
          if(o.collected) return;
          const d = Math.hypot(ship.x-o.x, ship.y-o.y);
          if(d < o.r + 0.02){
            o.collected = true; carrying++;
            hudObj.textContent = `Carrying: ${carrying} glimmerite`;
            toast('+1 Glimmerite');
          }
        });
        const d = Math.hypot(ship.x-beacon.x, ship.y-beacon.y);
        const inside = d < beacon.r + 0.02;
        if(inside && !beacon.wasInside){
          if(carrying > 0){
            const bonus = carrying >= 4 ? {power:1} : {};
            shipState.glimmerite += carrying;
            grantReward('Prospecting run', bonus, `Banked ${carrying} glimmerite at the relay beacon.`);
            toast(`+${carrying} Glimmerite banked!`);
            carrying = 0;
            hudObj.textContent = 'Carrying: 0 glimmerite';
            setTimeout(spawnOre, 400);
          } else {
            toast('Nothing to bank yet — go find some ore');
          }
        }
        beacon.wasInside = inside;
      }

      // ---- cargo delivery objective ----
      if(objKey==='cargo'){
        const dp = Math.hypot(ship.x-pickup.x, ship.y-pickup.y);
        const insideP = dp < pickup.r + 0.02;
        if(insideP && !pickup.wasInside){
          if(!cargoLoaded){
            cargoLoaded = true;
            hudObj.textContent = 'Cargo: loaded';
            toast('Crate loaded');
          }
        }
        pickup.wasInside = insideP;

        const dd = Math.hypot(ship.x-dropoff.x, ship.y-dropoff.y);
        const insideD = dd < dropoff.r + 0.02;
        if(insideD && !dropoff.wasInside){
          if(cargoLoaded){
            cargoLoaded = false;
            shipState.deliveries += 1;
            if(!shipState.deliveriesByDestination) shipState.deliveriesByDestination = {};
            shipState.deliveriesByDestination[destKey] = (shipState.deliveriesByDestination[destKey]||0) + 1;
            const crewLine = dest.crewLines[Math.floor(Math.random()*dest.crewLines.length)];
            grantReward('Cargo delivery', {morale:2}, [dest.deliverLine, crewLine]);
            applyRapportGain(dest.crewLink, 2);
            saveShipState();
            hudObj.textContent = 'Cargo: empty';
            toast(`Delivered to ${dest.name}! Morale +2, ${crewData[dest.crewLink].name} +rapport`);
          } else {
            toast('Nothing to deliver — pick up cargo first');
          }
        }
        dropoff.wasInside = insideD;
      }

      // ---- convoy escort objective ----
      if(objKey==='escort'){
        convoy.forEach(sh=>{
          if(sh.escorted) return;
          const d = Math.hypot(ship.x-sh.x, ship.y-sh.y);
          if(d < sh.r + 0.05){
            sh.escorted = true; escortedCount++;
            hudObj.textContent = `Escorted: ${escortedCount}/3`;
            toast('Convoy ship escorted safely');
          }
        });
        const d = Math.hypot(ship.x-escortBeacon.x, ship.y-escortBeacon.y);
        const inside = d < escortBeacon.r + 0.02;
        if(inside && !escortBeacon.wasInside){
          if(escortedCount >= 3){
            grantReward('Convoy escort', {morale:1}, 'Escorted the convoy safely through the debris field, checkpoint to checkpoint.');
            applyRapportGain('bas', 2);
            saveShipState();
            toast('Convoy delivered safely! Morale +1, Bas +rapport');
            escortedCount = 0;
            hudObj.textContent = 'Escorted: 0/3';
            setTimeout(spawnConvoy, 400);
          } else {
            toast(`Escort the rest of the convoy first (${escortedCount}/3)`);
          }
        }
        escortBeacon.wasInside = inside;
      }

      // ---- anomaly survey objective ----
      if(objKey==='anomaly'){
        anomalies.forEach(a=>{
          if(a.scanned) return;
          const d = Math.hypot(ship.x-a.x, ship.y-a.y);
          if(d < a.r + 0.025){
            a.scanned = true; anomaliesScanned++;
            shipState.glimmerite += 1;
            const line = anomalyLines[Math.floor(Math.random()*anomalyLines.length)];
            grantReward('Anomaly scan', {glimmerite:1}, line);
            hudObj.textContent = `Scanned: ${anomaliesScanned}/4`;
            toast('+1 Glimmerite — anomaly logged');
            if(anomaliesScanned % 4 === 0){
              if(shipState.storyFlags && shipState.storyFlags.signalDetected && !shipState.storyFlags.signalInvestigated){
                shipState.storyFlags.signalInvestigated = true;
                const traceLine = "Cross-referencing the scan data against Bridge's sensor log, Wren isolates the source — coordinates pointing toward a quiet stretch of space near the Aurin territory. Worth a closer look, in person.";
                grantReward('Signal Traced', {morale:2}, traceLine);
                applyRapportGain('wren', 3);
                toast('Signal traced! Wren has a lead. Morale +2, Wren +rapport.');
                const banner = document.getElementById('flight-episode-banner');
                if(banner){
                  banner.style.display = '';
                  banner.innerHTML = `
                    <div>
                      <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 01</span><b>Chapter 1 Complete</b></div>
                      <div class="mb-summary">${traceLine}</div>
                    </div>
                    <button class="primary-btn small" id="flight-episode-return">Return to Bridge</button>`;
                  const returnBtn = document.getElementById('flight-episode-return');
                  if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); showScreen('missions'); });
                }
              } else {
                toast('Survey complete! Wren will want the readings.');
                applyRapportGain('wren', 2);
                saveShipState();
              }
              anomaliesScanned = 0;
              hudObj.textContent = 'Scanned: 0/4';
              setTimeout(spawnAnomalies, 400);
            }
          }
        });
      }

      // ---- reference lock objective (Episode 7 Ch3/Ch4, shared mechanic) ----
      if(objKey==='reflock'){
        refPoints.forEach(p=>{
          if(p.locked) return;
          const d = Math.hypot(ship.x-p.x, ship.y-p.y);
          if(d < p.r + 0.025){
            p.locked = true; refPointsLocked++;
            const line = refLockLines[Math.floor(Math.random()*refLockLines.length)];
            toast(`Locked ${refPointsLocked}/${reflockTarget}`);
            hudObj.textContent = `Locked: ${refPointsLocked}/${reflockTarget}`;
            if(refPointsLocked >= reflockTarget){
              if(typeof foldCh4PendingFlight !== 'undefined' && foldCh4PendingFlight){
                foldCh4PendingFlight = false;
                const banner = document.getElementById('flight-episode-banner');
                if(banner){
                  banner.style.display = '';
                  banner.innerHTML = `
                    <div>
                      <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 07</span><b>Holding the Line</b></div>
                      <div class="mb-summary">${line} All three hold. Mira commits to the heading before the window closes.</div>
                    </div>
                    <button class="primary-btn small" id="flight-episode-return">Continue</button>`;
                  const returnBtn = document.getElementById('flight-episode-return');
                  if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); foldCh4StepFinalHit(); });
                }
              } else if(foldCh3PendingFlight){
                foldCh3PendingFlight = false;
                const banner = document.getElementById('flight-episode-banner');
                if(banner){
                  banner.style.display = '';
                  banner.innerHTML = `
                    <div>
                      <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 07</span><b>Reference Frame Established</b></div>
                      <div class="mb-summary">${line} All four hold, at least for now — Mira's already logging the heading before anything has a chance to drift again.</div>
                    </div>
                    <button class="primary-btn small" id="flight-episode-return">Continue</button>`;
                  const returnBtn = document.getElementById('flight-episode-return');
                  if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); foldCh3StepSable(); });
                }
              } else {
                toast('Reference frame established.');
                saveShipState();
                refPointsLocked = 0;
                hudObj.textContent = `Locked: 0/${reflockTarget}`;
                setTimeout(spawnRefPoints, 400);
              }
            }
          }
        });
      }

      // ---- diplomatic courier objective ----
      if(objKey==='courier'){
        const dp = Math.hypot(ship.x-courierPickup.x, ship.y-courierPickup.y);
        const insideP = dp < courierPickup.r + 0.02;
        if(insideP && !courierPickup.wasInside){
          if(!dignitaryAboard){
            dignitaryAboard = true; bumps = 0;
            hudObj.textContent = 'Dignitary: aboard (bumps: 0)';
            toast('Dignitary aboard — fly gently');
          }
        }
        courierPickup.wasInside = insideP;

        const dd = Math.hypot(ship.x-courierDropoff.x, ship.y-courierDropoff.y);
        const insideD = dd < courierDropoff.r + 0.02;
        if(insideD && !courierDropoff.wasInside){
          if(dignitaryAboard){
            dignitaryAboard = false;
            if(typeof voscourierPendingFlight !== 'undefined' && voscourierPendingFlight){
              voscourierPendingFlight = false;
              hudObj.textContent = 'Dignitary: not aboard';
              const banner = document.getElementById('flight-episode-banner');
              if(banner){
                banner.style.display = '';
                banner.innerHTML = `
                  <div>
                    <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 08</span><b>Arrival at the Voss Corridor</b></div>
                    <div class="mb-summary">The Directorate escort breaks away. Not warmth — just permission granted. Envoy Reyva is cleared to the negotiation site.</div>
                  </div>
                  <button class="primary-btn small" id="flight-episode-return">Continue</button>`;
                const returnBtn = document.getElementById('flight-episode-return');
                if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); vossCh1StepArrival(); });
              }
            } else if(typeof homeCh4PendingDocking !== 'undefined' && homeCh4PendingDocking){
              homeCh4PendingDocking = false;
              hudObj.textContent = 'Dignitary: not aboard';
              const banner = document.getElementById('flight-episode-banner');
              if(banner){
                banner.style.display = '';
                banner.innerHTML = `
                  <div>
                    <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 09</span><b>Docking Complete</b></div>
                    <div class="mb-summary">The ship slides into her assigned berth. Moorings engage. For the first time all season, she isn't going anywhere.</div>
                  </div>
                  <button class="primary-btn small" id="flight-episode-return">Continue</button>`;
                const returnBtn = document.getElementById('flight-episode-return');
                if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); homeCh4StepDockingComplete(); });
              }
            } else {
              let outcome, rapportGain, moraleGain;
              if(bumps===0){ outcome='smooth'; rapportGain=3; moraleGain=2; }
              else if(bumps<=2){ outcome='acceptable'; rapportGain=1; moraleGain=1; }
              else { outcome='rough'; rapportGain=0; moraleGain=0; }
              const line = courierLines[outcome][Math.floor(Math.random()*courierLines[outcome].length)];
              grantReward('Diplomatic courier', {morale:moraleGain}, line);
              if(rapportGain>0){ applyRapportGain('rook', rapportGain); saveShipState(); }
              toast(outcome==='smooth' ? 'Delivered smoothly! Rook impressed.' : outcome==='acceptable' ? 'Delivered, a little bumpy.' : 'Delivered... roughly. Rook will hear about this.');
              hudObj.textContent = 'Dignitary: not aboard';
            }
          } else {
            toast('No dignitary to deliver — pick them up first');
          }
        }
        courierDropoff.wasInside = insideD;

        if(dignitaryAboard) hudObj.textContent = `Dignitary: aboard (bumps: ${bumps})`;
      }

      // ---- supply run objective ----
      if(objKey==='supply'){
        if(!suppliesConsolidated){
          depots.forEach(dp=>{
            if(dp.collected) return;
            const d = Math.hypot(ship.x-dp.x, ship.y-dp.y);
            if(d < dp.r + 0.02){
              dp.collected = true; depotsCollected++;
              hudObj.textContent = `Depots: ${depotsCollected}/3`;
              toast('Depot supplies collected');
              if(depotsCollected >= 3){
                suppliesConsolidated = true;
                hudObj.textContent = `Cargo: consolidated, deliver to ${dest.name}`;
                toast('All depots collected — head to the destination');
              }
            }
          });
        }
        const dd = Math.hypot(ship.x-dropoff.x, ship.y-dropoff.y);
        const insideD = dd < dropoff.r + 0.02;
        if(insideD && !dropoff.wasInside){
          if(suppliesConsolidated){
            suppliesConsolidated = false;
            shipState.deliveries += 1;
            if(!shipState.deliveriesByDestination) shipState.deliveriesByDestination = {};
            shipState.deliveriesByDestination[destKey] = (shipState.deliveriesByDestination[destKey]||0) + 1;
            const crewLine = dest.crewLines[Math.floor(Math.random()*dest.crewLines.length)];
            grantReward('Supply run', {morale:3}, [`Delivered a full consolidated shipment to ${dest.name}.`, crewLine]);
            applyRapportGain(dest.crewLink, 2);
            saveShipState();
            toast(`Bulk shipment delivered to ${dest.name}! Morale +3, ${crewData[dest.crewLink].name} +rapport`);
            depotsCollected = 0;
            hudObj.textContent = 'Depots: 0/3';
            setTimeout(spawnDepots, 400);
          } else {
            toast('Nothing to deliver yet — collect all three depots first');
          }
        }
        dropoff.wasInside = insideD;
      }

      // ---- emergency evac objective ----
      if(objKey==='evac'){
        const d2 = Math.hypot(ship.x-evacSafeZone.x, ship.y-evacSafeZone.y);
        const inside = d2 < evacSafeZone.r + 0.02;
        if(inside && !evacSafeZone.wasInside){
          if(podAboard){
            podAboard = false;
            const line = evacLines[Math.floor(Math.random()*evacLines.length)];
            grantReward('Emergency evac', {morale:2}, line);
            applyRapportGain('amara', 2);
            saveShipState();
            toast('Delivered safely! Morale +2, Dr. Amara +rapport');
            hudObj.textContent = 'Pod: adrift';
            setTimeout(spawnPod, 400);
          } else {
            toast('Nothing to deliver yet — tractor the pod in first');
          }
        }
        evacSafeZone.wasInside = inside;
      }

      // ---- perimeter patrol: hostile movement ----
      if(objKey==='intercept' && hostile && hostile.alive){
        if(!hostile.retreating){
          if(Math.random() < 0.01){
            hostile.vx += (Math.random()-0.5)*0.002;
            hostile.vy += (Math.random()-0.5)*0.002;
          }
          const sp = Math.hypot(hostile.vx, hostile.vy);
          const maxHS = 0.006;
          if(sp > maxHS){ hostile.vx = hostile.vx/sp*maxHS; hostile.vy = hostile.vy/sp*maxHS; }
          hostile.x += hostile.vx; hostile.y += hostile.vy;
          const hm = 0.1;
          if(hostile.x < hm){ hostile.x = hm; hostile.vx *= -1; }
          if(hostile.x > 1-hm){ hostile.x = 1-hm; hostile.vx *= -1; }
          if(hostile.y < hm){ hostile.y = hm; hostile.vy *= -1; }
          if(hostile.y > 1-hm){ hostile.y = 1-hm; hostile.vy *= -1; }
        } else {
          hostile.x += hostile.vx*4; hostile.y += hostile.vy*4;
          hostile.retreatTimer++;
          if(hostile.retreatTimer > 40){
            hostile.alive = false;
            setTimeout(spawnHostile, 600);
          }
        }
      }

      // flashBolts (phaser shots + tractor pulses) age out regardless of which objective uses them
      if(flashBolts.length){
        flashBolts.forEach(b=>b.life--);
        flashBolts = flashBolts.filter(b=>b.life>0);
      }

      // ---- debris clearance objective ----
      if(objKey==='debris'){
        const d = Math.hypot(ship.x-debrisBeacon.x, ship.y-debrisBeacon.y);
        const inside = d < debrisBeacon.r + 0.02;
        if(inside && !debrisBeacon.wasInside){
          if(debrisCleared >= 6){
            if(warpCh3PendingDebris){
              warpCh3PendingDebris = false;
              warpCh3State.debrisDone = true;
              applyRapportGain('bas', 2);
              saveShipState();
              debrisCleared = 0;
              hudObj.textContent = 'Debris cleared: 0/6';
              const banner = document.getElementById('flight-episode-banner');
              if(banner){
                banner.style.display = '';
                banner.innerHTML = `
                  <div>
                    <div class="mb-left"><span class="tag" style="background:var(--gold)">Episode 05</span><b>Safety Margin Cleared</b></div>
                    <div class="mb-summary">The lane's clear, and the debris field is far enough back now to matter. Mira brings the shuttle back in smooth, clearly pleased with herself. Bas would be glad to hear it — Talia already logged the sweep as clean.</div>
                  </div>
                  <button class="primary-btn small" id="flight-episode-return">Continue</button>`;
                const returnBtn = document.getElementById('flight-episode-return');
                if(returnBtn) returnBtn.addEventListener('click', ()=>{ stopFlightLoop(); warpCh3CheckProgress(); });
              }
            } else {
              grantReward('Debris clearance', {morale:1}, 'Cleared the shipping lane of drifting debris — a clean, uneventful sweep.');
              applyRapportGain('bas', 2);
              saveShipState();
              toast('Lane cleared and reported! Morale +1, Bas +rapport');
              debrisCleared = 0;
              hudObj.textContent = 'Debris cleared: 0/6';
              setTimeout(spawnDebris, 400);
            }
          } else {
            toast(`Clear the remaining debris first (${debrisCleared}/6)`);
          }
        }
        debrisBeacon.wasInside = inside;
      }

      // ---- time trial (piggybacks on the ambient ring circuit above) ----
      if(objKey==='timetrial'){
        const elapsed = (Date.now()-trialStartTime)/1000;
        hudObj.textContent = `Time: ${elapsed.toFixed(1)}s` + (shipState.bestTimeTrial ? ` · Best: ${shipState.bestTimeTrial.toFixed(1)}s` : '');
      }

      // ---- mail run objective ----
      if(objKey==='mailrun'){
        const dp = Math.hypot(ship.x-mailPickup.x, ship.y-mailPickup.y);
        const insideP = dp < mailPickup.r + 0.02;
        if(insideP && !mailPickup.wasInside){
          if(!mailLoaded && mailDelivered < mailStops.length){
            mailLoaded = true;
            hudObj.textContent = `Mail loaded — ${mailStops.length} stops`;
            toast('Mail bundle loaded');
          } else if(mailLoaded && mailDelivered < mailStops.length){
            toast(`Still ${mailStops.length-mailDelivered} parcels to deliver`);
          } else if(mailLoaded && mailDelivered >= mailStops.length){
            grantReward('Mail run', {morale:2}, `Completed a full mail run across ${mailStops.length} stops — everything delivered on time.`);
            applyRapportGain('talia', 3);
            saveShipState();
            toast('Mail run complete! Morale +2, Talia +rapport');
            mailStops.forEach(s=>s.delivered=false);
            mailDelivered = 0;
            mailLoaded = false;
            hudObj.textContent = 'Mail: not loaded';
          }
        }
        mailPickup.wasInside = insideP;

        if(mailLoaded){
          mailStops.forEach(s=>{
            if(s.delivered) return;
            const d = Math.hypot(ship.x-s.x, ship.y-s.y);
            if(d < 0.045+0.02){
              s.delivered = true; mailDelivered++;
              hudObj.textContent = mailDelivered < mailStops.length
                ? `Delivered ${mailDelivered}/${mailStops.length} — return to the airlock when done`
                : `All ${mailStops.length} delivered — return to the airlock to sign off`;
              toast(`Parcel delivered to ${s.name}`);
            }
          });
        }
      }

      // ---- crew ferry objective ----
      if(objKey==='ferry'){
        const dp = Math.hypot(ship.x-ferryPickup.x, ship.y-ferryPickup.y);
        const insideP = dp < ferryPickup.r + 0.02;
        if(insideP && !ferryPickup.wasInside){
          if(!miraAboard){
            miraAboard = true;
            hudObj.textContent = 'Passenger: Mira aboard';
            toast('Mira hops aboard, already looking forward to it');
          }
        }
        ferryPickup.wasInside = insideP;

        const dd = Math.hypot(ship.x-ferryDropoff.x, ship.y-ferryDropoff.y);
        const insideD = dd < ferryDropoff.r + 0.02;
        if(insideD && !ferryDropoff.wasInside){
          if(miraAboard){
            miraAboard = false;
            const line = ferryLines[Math.floor(Math.random()*ferryLines.length)];
            grantReward('Crew ferry', {morale:2}, line);
            applyRapportGain('mira', 3);
            saveShipState();
            toast('Delivered! Morale +2, Mira +rapport');
            hudObj.textContent = 'Passenger: not aboard';
          } else {
            toast('No passenger aboard — pick up Mira first');
          }
        }
        ferryDropoff.wasInside = insideD;
      }

      draw();
      flightRAF = requestAnimationFrame(step);
    }

    function drawMarker(x,y,r,fillColor,strokeColor,w,h){
      ctx.save();
      ctx.translate(x*w, y*h);
      ctx.fillStyle = fillColor;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 2*devicePixelRatio;
      const s = r*w;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(-s,-s,s*2,s*2, 6*devicePixelRatio); else ctx.rect(-s,-s,s*2,s*2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function draw(){
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#050409'; ctx.fillRect(0,0,w,h);
      // stars
      ctx.fillStyle = 'rgba(242,236,221,0.5)';
      for(let i=0;i<40;i++){
        const sx = (i*197 % 1000)/1000 * w;
        const sy = (i*331 % 1000)/1000 * h;
        ctx.fillRect(sx, sy, 1.2, 1.2);
      }
      // rings
      rings.forEach(r=>{
        if(r.collected) return;
        r.pulse += 0.05;
        const pr = (r.r + Math.sin(r.pulse)*0.004) * w;
        ctx.beginPath();
        ctx.arc(r.x*w, r.y*h, pr, 0, Math.PI*2);
        ctx.strokeStyle = '#F2C879';
        ctx.lineWidth = 3*devicePixelRatio;
        ctx.stroke();
      });
      // ore (prospecting)
      if(objKey==='prospect'){
        ore.forEach(o=>{
          if(o.collected) return;
          o.pulse += 0.06;
          const s = (o.r + Math.sin(o.pulse)*0.003) * w;
          ctx.save();
          ctx.translate(o.x*w, o.y*h);
          ctx.rotate(Math.PI/4);
          ctx.fillStyle = 'rgba(242,200,121,0.85)';
          ctx.strokeStyle = '#F2C879';
          ctx.lineWidth = 2*devicePixelRatio;
          ctx.beginPath();
          ctx.rect(-s/2,-s/2,s,s);
          ctx.fill(); ctx.stroke();
          ctx.restore();
        });
        drawMarker(beacon.x, beacon.y, beacon.r, 'rgba(140,158,219,0.25)', '#8C9EDB', w, h);
      }
      // cargo markers
      if(objKey==='cargo'){
        drawMarker(pickup.x, pickup.y, pickup.r, 'rgba(232,166,77,0.25)', '#E8A64D', w, h);
        const dh = dest.hex;
        const dr = parseInt(dh.slice(1,3),16), dg = parseInt(dh.slice(3,5),16), db = parseInt(dh.slice(5,7),16);
        drawMarker(dropoff.x, dropoff.y, dropoff.r, `rgba(${dr},${dg},${db},0.25)`, dh, w, h);
      }
      // convoy escort markers
      if(objKey==='escort'){
        convoy.forEach(sh=>{
          if(sh.escorted) return;
          sh.pulse += 0.05;
          const s = (sh.r + Math.sin(sh.pulse)*0.004) * w;
          ctx.save();
          ctx.translate(sh.x*w, sh.y*h);
          ctx.fillStyle = 'rgba(217,139,146,0.7)';
          ctx.beginPath();
          ctx.moveTo(s*0.9,0); ctx.lineTo(-s*0.6,s*0.5); ctx.lineTo(-s*0.6,-s*0.5);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        });
        drawMarker(escortBeacon.x, escortBeacon.y, escortBeacon.r, 'rgba(140,158,219,0.25)', '#8C9EDB', w, h);
      }
      // anomaly markers
      if(objKey==='anomaly'){
        anomalies.forEach(a=>{
          if(a.scanned) return;
          a.pulse += 0.04;
          const baseR = a.r * w;
          ctx.save();
          ctx.translate(a.x*w, a.y*h);
          for(let ring=0; ring<3; ring++){
            const rr = baseR*(0.4+ring*0.3) + Math.sin(a.pulse+ring)*3;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(156,184,143,${0.5-ring*0.12})`;
            ctx.lineWidth = 1.5*devicePixelRatio;
            ctx.arc(0,0,rr,0,Math.PI*2);
            ctx.stroke();
          }
          ctx.restore();
        });
      }
      // reference lock markers (Episode 7 Ch3) - pulsing diamonds, deliberately distinct from
      // anomaly survey's circles so the two objectives never look visually identical
      if(objKey==='reflock'){
        refPoints.forEach(p=>{
          if(p.locked) return;
          p.pulse += 0.04;
          const baseR = p.r * w;
          const pulseR = baseR + Math.sin(p.pulse)*3;
          ctx.save();
          ctx.translate(p.x*w, p.y*h);
          ctx.beginPath();
          ctx.moveTo(0, -pulseR);
          ctx.lineTo(pulseR, 0);
          ctx.lineTo(0, pulseR);
          ctx.lineTo(-pulseR, 0);
          ctx.closePath();
          ctx.fillStyle = 'rgba(140,158,219,0.18)';
          ctx.strokeStyle = '#8C9EDB';
          ctx.lineWidth = 2*devicePixelRatio;
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
      }
      // courier markers
      if(objKey==='courier'){
        drawMarker(courierPickup.x, courierPickup.y, courierPickup.r, 'rgba(232,166,77,0.25)', '#E8A64D', w, h);
        const dh = courierDest.hex;
        const dr = parseInt(dh.slice(1,3),16), dg = parseInt(dh.slice(3,5),16), db = parseInt(dh.slice(5,7),16);
        drawMarker(courierDropoff.x, courierDropoff.y, courierDropoff.r, `rgba(${dr},${dg},${db},0.25)`, dh, w, h);
      }
      // supply run markers
      if(objKey==='supply'){
        if(!suppliesConsolidated){
          depots.forEach(dp=>{
            if(dp.collected) return;
            dp.pulse += 0.05;
            const s = (dp.r + Math.sin(dp.pulse)*0.003) * w;
            ctx.save();
            ctx.translate(dp.x*w, dp.y*h);
            ctx.rotate(Math.PI/4);
            ctx.fillStyle = 'rgba(232,166,77,0.75)';
            ctx.strokeStyle = '#E8A64D';
            ctx.lineWidth = 2*devicePixelRatio;
            ctx.beginPath();
            ctx.rect(-s/2,-s/2,s,s);
            ctx.fill(); ctx.stroke();
            ctx.restore();
          });
        }
        const dh = dest.hex;
        const dr = parseInt(dh.slice(1,3),16), dg = parseInt(dh.slice(3,5),16), db = parseInt(dh.slice(5,7),16);
        drawMarker(dropoff.x, dropoff.y, dropoff.r, `rgba(${dr},${dg},${db},0.25)`, dh, w, h);
      }
      // evac markers
      if(objKey==='evac'){
        if(pod && !pod.collected){
          pod.pulse += 0.05;
          const s = (pod.r + Math.sin(pod.pulse)*0.004) * w;
          ctx.save();
          ctx.translate(pod.x*w, pod.y*h);
          ctx.fillStyle = 'rgba(140,158,219,0.6)';
          ctx.beginPath();
          ctx.ellipse(0,0,s,s*0.55,0,0,Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
        drawMarker(evacSafeZone.x, evacSafeZone.y, evacSafeZone.r, 'rgba(217,139,146,0.25)', '#D98B92', w, h);
      }
      // debris clearance markers
      if(objKey==='debris'){
        debris.forEach(d=>{
          if(!d.alive) return;
          d.pulse += 0.04;
          const s = (d.r + Math.sin(d.pulse)*0.003) * w;
          ctx.save();
          ctx.translate(d.x*w, d.y*h);
          ctx.fillStyle = 'rgba(217,139,146,0.55)';
          ctx.beginPath();
          ctx.arc(0,0,s,0,Math.PI*2);
          ctx.fill();
          ctx.restore();
        });
        drawMarker(debrisBeacon.x, debrisBeacon.y, debrisBeacon.r, 'rgba(140,158,219,0.25)', '#8C9EDB', w, h);
      }
      // perimeter patrol markers
      if(objKey==='intercept' && hostile && hostile.alive){
        const fadeOp = hostile.retreating ? Math.max(0, 1-(hostile.retreatTimer/40)) : 1;
        ctx.save();
        ctx.globalAlpha = fadeOp;
        ctx.translate(hostile.x*w, hostile.y*h);
        ctx.rotate(Math.atan2(hostile.vy, hostile.vx) || 0);
        const s = 14*devicePixelRatio*(w/600);
        ctx.fillStyle = 'rgba(217,139,146,0.75)';
        ctx.beginPath();
        ctx.moveTo(s,0); ctx.lineTo(-s*0.7,s*0.5); ctx.lineTo(-s*0.4,0); ctx.lineTo(-s*0.7,-s*0.5);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        if(!hostile.retreating){
          ctx.save();
          ctx.strokeStyle = 'rgba(242,200,121,0.5)';
          ctx.lineWidth = 1.5*devicePixelRatio;
          ctx.beginPath();
          ctx.arc(hostile.x*w, hostile.y*h, 20*devicePixelRatio*(w/600), -Math.PI/2, -Math.PI/2 + Math.PI*2*(hostile.shields/3));
          ctx.stroke();
          ctx.restore();
        }
      }
      // shared: phaser bolts + tractor pulses
      if(flashBolts.length){
        flashBolts.forEach(b=>{
          ctx.save();
          const alpha = Math.max(0, Math.min(1, b.life/6));
          ctx.strokeStyle = b.tractor ? `rgba(140,158,219,${alpha})` : `rgba(242,200,121,${alpha})`;
          ctx.lineWidth = (b.tractor ? 3 : 2) * devicePixelRatio;
          ctx.beginPath();
          ctx.moveTo(b.x1*w, b.y1*h);
          ctx.lineTo(b.x2*w, b.y2*h);
          ctx.stroke();
          ctx.restore();
        });
      }
      // mail run markers
      if(objKey==='mailrun'){
        drawMarker(mailPickup.x, mailPickup.y, mailPickup.r, 'rgba(232,166,77,0.25)', '#E8A64D', w, h);
        mailStops.forEach(s=>{
          if(s.delivered) return;
          const dh = s.hex;
          const dr = parseInt(dh.slice(1,3),16), dg = parseInt(dh.slice(3,5),16), db = parseInt(dh.slice(5,7),16);
          drawMarker(s.x, s.y, 0.035, `rgba(${dr},${dg},${db},0.25)`, dh, w, h);
        });
      }
      // crew ferry markers
      if(objKey==='ferry'){
        drawMarker(ferryPickup.x, ferryPickup.y, ferryPickup.r, 'rgba(232,166,77,0.25)', '#E8A64D', w, h);
        const dh = destinationsData.wrenhaven.hex;
        const dr = parseInt(dh.slice(1,3),16), dg = parseInt(dh.slice(3,5),16), db = parseInt(dh.slice(5,7),16);
        drawMarker(ferryDropoff.x, ferryDropoff.y, ferryDropoff.r, `rgba(${dr},${dg},${db},0.25)`, dh, w, h);
      }
      // ship
      ctx.save();
      ctx.translate(ship.x*w, ship.y*h);
      ctx.rotate(ship.angle);
      ctx.fillStyle = c.accent;
      const s = c.size * devicePixelRatio * (w/600);
      ctx.beginPath();
      ctx.moveTo(s, 0);
      ctx.lineTo(-s*0.7, s*0.6);
      ctx.lineTo(-s*0.4, 0);
      ctx.lineTo(-s*0.7, -s*0.6);
      ctx.closePath();
      ctx.fill();
      if(keys.thrust){
        ctx.fillStyle = 'rgba(232,166,77,0.8)';
        ctx.beginPath();
        ctx.moveTo(-s*0.4,0); ctx.lineTo(-s*1.1, s*0.25); ctx.lineTo(-s*1.1,-s*0.25);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    step();
  }

})();
</script>
</body>
